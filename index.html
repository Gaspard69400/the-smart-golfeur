<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Smart Golfer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─────────────────────────────────────────
   OPTION 7 — PREMIUM ÉPURÉ
   Police    : Plus Jakarta Sans
   Fond      : Crème chaud #FEFCF8 / #FAF8F2
   Accent    : Or #C9A84C / #A8851E
   Nuit      : Brun sombre #1A1209
   Vert      : Golf #2D7D3A
   Texte     : #1A1209 / #5A4A2A / #A89878
───────────────────────────────────────── */

:root {
  /* Couleur signature */
  --gold:      #C9A84C;
  --gold-l:    #E8C96A;
  --gold-d:    #A8851E;
  --gold-dim:  rgba(201,168,76,0.10);
  --gold-dim2: rgba(201,168,76,0.06);

  /* Fonds crème */
  --bg:        #FEFCF8;
  --bg2:       #FAF8F2;
  --bg3:       #F5F1E8;
  --bg4:       #EDE8DC;

  /* Brun nuit (headers, accents sombres) */
  --night:     #1A1209;
  --night2:    #2E2010;
  --night3:    #3D2E1A;

  /* Blanc pur (cartes) */
  --white:     #FFFFFF;

  /* Textes */
  --tx:        #1A1209;
  --tx2:       #2E1E08;
  --tx3:       #6A5030;
  --tx4:       #8A6840;

  /* Vert golf */
  --ok:        #1E6B2A;
  --ok2:       #2D7D3A;
  --ok3:       #4FA85A;
  --ok-bg:     #EEF7EE;
  --ok-bg2:    rgba(45,125,58,0.08);

  /* Rouge */
  --ng:        #9B2020;
  --ng2:       #C0392B;
  --ng3:       #E04040;
  --ng-bg:     #FEF2F0;

  /* Orange */
  --wn:        #C45E0A;
  --wn2:       #E07020;
  --wn-bg:     #FEF5EC;

  /* Bordures */
  --bd:        rgba(168,133,30,0.18);
  --bd2:       rgba(168,133,30,0.10);
  --bd3:       rgba(26,18,9,0.06);
  --bd-card:   #EDE8DC;

  /* Ombres légères */
  --shadow-sm: 0 1px 3px rgba(26,18,9,0.06);
  --shadow-md: 0 2px 8px rgba(26,18,9,0.08);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ─── LOGIN SCREEN ─── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 20px;
  background: var(--bg);
}

.login-brand {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 42px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -1.5px;
  text-align: center;
  margin-bottom: 4px;
}

.login-brand span { color: var(--gold); }

.login-tagline {
  font-size: 11px;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-align: center;
  margin-bottom: 44px;
  font-weight: 500;
}

.login-card {
  background: var(--white);
  border: 1px solid var(--bd-card);
  border-radius: 16px;
  padding: 32px 36px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-md);
}

.login-card-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--tx);
  margin-bottom: 3px;
  letter-spacing: -0.3px;
}

.login-card-sub {
  font-size: 12px;
  color: var(--tx3);
  margin-bottom: 22px;
}

/* ─── PROFILE BUTTONS ─── */
#profiles-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 22px;
}

.profile-btn {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--bd-card);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
  text-align: left;
  width: 100%;
}

.profile-btn:hover {
  border-color: var(--gold);
  background: var(--gold-dim2);
  box-shadow: var(--shadow-sm);
}

.profile-btn.selected {
  border-color: var(--gold);
  background: var(--gold-dim);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
}

.profile-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  letter-spacing: -0.5px;
}

.profile-info { flex: 1; }

.profile-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--tx);
  margin-bottom: 2px;
  letter-spacing: -0.2px;
}

.profile-role {
  font-size: 11px;
  color: var(--tx3);
  font-weight: 400;
}

/* ─── DIVIDER ─── */
.login-divider {
  text-align: center;
  font-size: 11px;
  color: var(--tx4);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  margin: 20px 0;
  position: relative;
}

.login-divider::before,
.login-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 34%;
  height: 1px;
  background: var(--bd-card);
}
.login-divider::before { left: 0; }
.login-divider::after  { right: 0; }

/* ─── FORM ─── */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 10px;
}

.form-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--tx3);
}

.form-input,
.form-select {
  background: var(--bg);
  border: 1px solid var(--bd-card);
  border-radius: 10px;
  padding: 9px 12px;
  color: var(--tx);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 400;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  width: 100%;
}

.form-input:focus,
.form-select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
}

.form-input::placeholder { color: var(--tx4); }
.form-select { cursor: pointer; appearance: none; }

/* ─── LOGIN BUTTON ─── */
.btn-login {
  width: 100%;
  background: var(--gold);
  color: var(--night);
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: background 0.15s, transform 0.1s;
  margin-top: 14px;
}

.btn-login:hover  { background: var(--gold-l); }
.btn-login:active { transform: scale(0.99); }

/* ─── APP SHELL ─── */
#app {
  display: none;
  min-height: 100vh;
  flex-direction: column;
}

#app.visible { display: flex; }

/* ─── TOP NAV ─── */
.topnav {
  height: 56px;
  background: var(--white);
  border-bottom: 1px solid var(--bd-card);
  display: flex;
  align-items: center;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.nav-brand {
  padding: 0 22px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-right: 1px solid var(--bd3);
  height: 100%;
  flex-shrink: 0;
}

.nav-emblem {
  width: 30px;
  height: 30px;
  background: var(--gold);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--night);
  flex-shrink: 0;
}

.nav-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.5px;
}

.nav-title span { color: var(--gold-d); }

.nav-tabs {
  display: flex;
  height: 100%;
  flex: 1;
  overflow-x: auto;
  padding: 0 6px;
}

.nav-tabs::-webkit-scrollbar { display: none; }

.nav-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--tx3);
  border: none;
  background: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  flex-shrink: 0;
  height: 100%;
}

.nav-tab:hover { color: var(--tx); }

.nav-tab.active {
  color: var(--gold-d);
  border-bottom-color: var(--gold);
  font-weight: 600;
}

.nav-tab-icon {
  font-size: 14px;
  opacity: 0.6;
  transition: opacity 0.15s;
}

.nav-tab.active .nav-tab-icon { opacity: 1; }

.nav-right {
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-left: 1px solid var(--bd3);
  height: 100%;
  flex-shrink: 0;
  margin-left: auto;
}

.nav-hcp-block { text-align: right; }

.nav-hcp-val {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-d);
  line-height: 1;
  letter-spacing: -0.5px;
}

.nav-hcp-lbl {
  font-size: 9px;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
}

.nav-user {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 10px;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}

.nav-user:hover {
  background: var(--bg);
  border-color: var(--bd-card);
}

.nav-user-av {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

.nav-user-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--tx);
}

.nav-role-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 20px;
  letter-spacing: 0.03em;
}

.role-head    { background: #FDF5E4; color: #8A6200; border: 1px solid #F0D880; }
.role-coach   { background: var(--gold-dim); color: var(--gold-d); border: 1px solid rgba(201,168,76,0.3); }
.role-captain { background: #EEF4FF; color: #2855A0; border: 1px solid #C0D4FF; }
.role-player  { background: var(--ok-bg); color: var(--ok2); border: 1px solid rgba(45,125,58,0.25); }

/* ─── CONTENT AREA ─── */
.app-content { flex: 1; overflow-y: auto; background: var(--bg); }
.app-content::-webkit-scrollbar { width: 4px; }
.app-content::-webkit-scrollbar-thumb { background: var(--bd-card); border-radius: 2px; }

.app-page {
  display: none;
  padding: 28px 32px;
  min-height: calc(100vh - 56px);
}

.app-page.active { display: block; }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--night);
  border-radius: 10px;
  padding: 11px 18px;
  font-size: 12px;
  font-weight: 500;
  color: var(--bg);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 999;
  max-width: 320px;
  box-shadow: var(--shadow-md);
}

.toast.show { opacity: 1; transform: translateY(0); }

/* ─── COMING SOON ─── */
.welcome-hero {
  text-align: center;
  padding: 60px 20px;
  max-width: 560px;
  margin: 0 auto;
}

.welcome-hero h1 {
  font-size: 32px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -1px;
  margin-bottom: 12px;
}

.welcome-hero p {
  font-size: 13px;
  color: var(--tx3);
  line-height: 1.7;
  margin-bottom: 32px;
}

.welcome-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 36px;
}

.wstat {
  background: var(--white);
  border: 1px solid var(--bd-card);
  border-radius: 14px;
  padding: 18px 12px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.wstat-val {
  font-size: 30px;
  font-weight: 700;
  color: var(--gold-d);
  line-height: 1;
  letter-spacing: -1px;
  margin-bottom: 6px;
}

.wstat-lbl {
  font-size: 11px;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
}

.coming-soon {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  gap: 14px;
  text-align: center;
}

.coming-soon-icon { font-size: 32px; opacity: 0.2; }

.coming-soon h3 {
  font-size: 20px;
  font-weight: 600;
  color: var(--tx2);
  letter-spacing: -0.3px;
}

.coming-soon p {
  font-size: 12px;
  color: var(--tx3);
  line-height: 1.6;
  max-width: 260px;
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg3); }
::-webkit-scrollbar-thumb { background: var(--bd-card); border-radius: 2px; }


/* ════════════════════════════════════
   DASHBOARD — SESSION 2 · Option 7
════════════════════════════════════ */

.dash-wrap { display: flex; flex-direction: column; gap: 20px; }

/* Header */
.dash-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 4px;
}

.dash-greeting {
  font-size: 28px;
  font-weight: 700;
  color: var(--tx);
  line-height: 1;
  margin-bottom: 5px;
  letter-spacing: -1px;
}

.dash-meta {
  font-size: 11px;
  color: var(--tx3);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Buttons */
.dash-btn {
  padding: 8px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: all 0.15s;
  border: 1px solid;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.dash-btn-gold {
  background: var(--gold);
  color: var(--night);
  border-color: var(--gold);
}

.dash-btn-gold:hover { background: var(--gold-l); border-color: var(--gold-l); }

.dash-btn-outline {
  background: var(--white);
  color: var(--tx2);
  border-color: var(--bd-card);
}

.dash-btn-outline:hover { border-color: var(--gold); color: var(--gold-d); }

/* Grilles */
.dash-g5  { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; }
.dash-g4  { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.dash-g3  { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.dash-g2  { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dash-g21 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
.dash-g31 { display: grid; grid-template-columns: 3fr 1fr; gap: 14px; }

/* KPI Cards */
.kpi-card {
  background: var(--white);
  border: 1px solid var(--bd-card);
  border-radius: 14px;
  padding: 16px 16px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.18s, border-color 0.18s;
}

.kpi-card:hover {
  box-shadow: var(--shadow-md);
  border-color: rgba(168,133,30,0.25);
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--gold);
  opacity: 0.45;
  border-radius: 14px 14px 0 0;
}

.kpi-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--tx);
  line-height: 1;
  letter-spacing: -1px;
  margin-bottom: 6px;
}

.kpi-trend {
  font-size: 11px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 3px;
}

.trend-up   { color: var(--ok2); }
.trend-down { color: var(--ng2); }
.trend-flat { color: var(--tx3); }

/* Panels */
.panel {
  background: var(--white);
  border: 1px solid var(--bd-card);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.panel-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--bd3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--bg2);
}

.panel-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.3px;
}

.panel-sub {
  font-size: 10px;
  font-weight: 500;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.panel-body { padding: 16px 18px; }

/* Strokes Gained */
.sg-card {
  background: var(--bg);
  border: 1px solid var(--bd-card);
  border-radius: 12px;
  padding: 14px 12px;
  text-align: center;
  transition: border-color 0.15s;
}

.sg-card:hover { border-color: var(--gold); }

.sg-label {
  font-size: 9px;
  font-weight: 600;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 7px;
}

.sg-value {
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.5px;
  margin-bottom: 5px;
}

.sg-pos { color: var(--ok2); }
.sg-neg { color: var(--ng2); }
.sg-neu { color: var(--tx3); }

.sg-bar-track {
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}

.sg-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }

/* Progress rows */
.prog-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 7px 0;
  border-bottom: 1px solid var(--bd3);
}
.prog-row:last-child { border-bottom: none; }
.prog-label { font-size: 11px; font-weight: 500; color: var(--tx2); width: 130px; flex-shrink: 0; }
.prog-track { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.prog-fill  { height: 100%; border-radius: 2px; transition: width 0.5s; }
.prog-value { font-size: 11px; font-weight: 600; color: var(--tx); width: 42px; text-align: right; flex-shrink: 0; }
.prog-ref   { font-size: 10px; color: var(--tx3); width: 55px; text-align: right; flex-shrink: 0; font-weight: 500; }

/* Chart */
.chart-wrap { position: relative; width: 100%; }

/* Roadmap */
.roadmap-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

.road-phase {
  background: var(--bg);
  border: 1px solid var(--bd-card);
  border-radius: 12px;
  padding: 14px 12px;
  border-top: 3px solid var(--bg3);
}

.road-phase.done     { border-top-color: var(--ok2); background: var(--ok-bg2); border-color: rgba(45,125,58,0.15); }
.road-phase.active   { border-top-color: var(--gold); background: var(--gold-dim2); border-color: rgba(201,168,76,0.25); }
.road-phase.upcoming { opacity: 0.55; }

.road-phase-num {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}

.road-phase.done   .road-phase-num { color: var(--ok2); }
.road-phase.active .road-phase-num { color: var(--gold-d); }
.road-phase.upcoming .road-phase-num { color: var(--tx3); }

.road-phase-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.3px;
  margin-bottom: 8px;
}

.road-phase.upcoming .road-phase-name { color: var(--tx2); }

.road-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }

.rtag {
  font-size: 9px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/*

var currentUser     = null;
var selectedProfile = null;

/* ─── LOCALSTORAGE ─── */

function lsGet(key) {
  try {
    var val = localStorage.getItem('tsg_' + key);
    return val ? JSON.parse(val) : null;
  } catch(e) {
    return null;
  }
}

function lsSet(key, value) {
  try {
    localStorage.setItem('tsg_' + key, JSON.stringify(value));
    return true;
  } catch(e) {
    return false;
  }
}

/* ─── TOAST ─── */

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() {
    t.classList.remove('show');
  }, 2800);
}

/* ─── BUILD PROFILES (createElement - jamais innerHTML) ─── */

function buildProfiles() {
  var container = document.getElementById('profiles-list');
  if (!container) return;

  // Vider le container
  while (container.firstChild) {
    container.removeChild(container.firstChild);
  }

  var profiles = lsGet('profiles') || DEFAULT_PROFILES;

  profiles.forEach(function(p) {
    // Créer le bouton principal
    var btn = document.createElement('button');
    btn.className = 'profile-btn';
    btn.id = 'pb-' + p.id;
    btn.setAttribute('type', 'button');
    btn.setAttribute('data-pid', p.id);

    // Avatar
    var av = document.createElement('div');
    av.className = 'profile-avatar';
    av.style.background = p.bg;
    av.style.color = p.color;
    av.textContent = p.initials;

    // Infos
    var info = document.createElement('div');
    info.className = 'profile-info';

    var name = document.createElement('div');
    name.className = 'profile-name';
    name.textContent = p.name;

    var role = document.createElement('div');
    role.className = 'profile-role';
    role.style.color = p.color;
    var roleText = ROLE_LABELS[p.role] || p.role;
    if (p.hcp !== null && p.hcp !== undefined) {
      roleText += ' \u00b7 Hcp ' + p.hcp;
    }
    role.textContent = roleText;

    info.appendChild(name);
    info.appendChild(role);
    btn.appendChild(av);
    btn.appendChild(info);

    // Attacher le click PROPREMENT (closure pour capturer p.id)
    btn.addEventListener('click', (function(pid) {
      return function() { selectProfile(pid); };
    })(p.id));

    container.appendChild(btn);
  });

  // Auto-sélectionner le dernier profil ou le premier
  var lastId = lsGet('lastUser');
  var profiles2 = lsGet('profiles') || DEFAULT_PROFILES;
  var autoId = null;

  if (lastId) {
    for (var i = 0; i < profiles2.length; i++) {
      if (profiles2[i].id === lastId) { autoId = lastId; break; }
    }
  }

  if (!autoId && profiles2.length > 0) {
    autoId = profiles2[0].id;
  }

  if (autoId) selectProfile(autoId);
}

function selectProfile(id) {
  var profiles = lsGet('profiles') || DEFAULT_PROFILES;
  selectedProfile = null;

  for (var i = 0; i < profiles.length; i++) {
    if (profiles[i].id === id) {
      selectedProfile = profiles[i];
      break;
    }
  }

  // Mettre à jour l'UI
  var btns = document.querySelectorAll('.profile-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.remove('selected');
  }

  var target = document.getElementById('pb-' + id);
  if (target) target.classList.add('selected');
}

/* ─── LOGIN ─── */

function doLogin() {
  var nameEl = document.getElementById('inp-name');
  var hcpEl  = document.getElementById('inp-hcp');
  var roleEl = document.getElementById('inp-role');

  var nameVal = nameEl ? nameEl.value.trim() : '';

  if (nameVal) {
    // Créer un nouveau profil depuis le formulaire
    var hcpVal  = hcpEl  ? (parseFloat(hcpEl.value) || null) : null;
    var roleVal = roleEl ? (roleEl.value || 'player')        : 'player';

    // Générer les initiales
    var words    = nameVal.split(' ').filter(function(w) { return w.length > 0; });
    var initials = words.map(function(w) { return w[0].toUpperCase(); }).join('').slice(0, 2);
    if (!initials) initials = '?';

    // Couleur aléatoire parmi la palette
    var palette = [
      { color: '#C9A84C', bg: 'rgba(201,168,76,0.2)'   },
      { color: '#3D8A65', bg: 'rgba(61,138,101,0.2)'   },
      { color: '#85B7EB', bg: 'rgba(133,183,235,0.2)'  },
      { color: '#EF9F27', bg: 'rgba(239,159,39,0.2)'   },
      { color: '#AFA9EC', bg: 'rgba(175,169,236,0.2)'  },
      { color: '#F0997B', bg: 'rgba(240,153,123,0.2)'  }
    ];
    var pick = palette[Math.floor(Math.random() * palette.length)];

    var newProfile = {
      id:       'user_' + Date.now(),
      name:     nameVal,
      hcp:      hcpVal,
      role:     roleVal,
      color:    pick.color,
      bg:       pick.bg,
      initials: initials
    };

    // Ajouter aux profils sauvegardés
    var profiles = lsGet('profiles') || DEFAULT_PROFILES.slice();
    profiles.push(newProfile);
    lsSet('profiles', profiles);
    selectedProfile = newProfile;
  }

  // Fallback : utiliser le profil sélectionné, ou le premier par défaut
  if (!selectedProfile) {
    var allProfiles = lsGet('profiles') || DEFAULT_PROFILES;
    selectedProfile = allProfiles[0] || DEFAULT_PROFILES[0];
  }

  // Sauvegarder le dernier utilisateur
  lsSet('lastUser', selectedProfile.id);
  currentUser = selectedProfile;

  // Lancer l'application
  launchApp();
}

/* ─── LAUNCH APP ─── */

function launchApp() {
  // 1. Cacher le login
  var loginEl = document.getElementById('login-screen');
  if (loginEl) loginEl.style.display = 'none';

  // 2. Afficher l'app
  var appEl = document.getElementById('app');
  if (appEl) appEl.classList.add('visible');

  // 3. Mettre à jour la barre de navigation
  updateNavUI();

  // 4. Construire la navigation
  buildNavTabs();

  // 5. Construire les pages (chacune protégée)
  buildPages();

  // 6. Initialiser la scorecard
  try { initScorecardPage(); } catch(e) { console.warn('SC:', e.message); }
  // 6b. Initialiser le dashboard avec les vraies données
  try { initDashboard(); } catch(e) { console.warn('Dashboard:', e.message); }

  // 7. Activer la première page
  showPage('dashboard');

  // 8. Confirmer
  showToast('Bienvenue ' + currentUser.name + ' \u2014 Bonne session !');
}

/* ─── NAVIGATION UI ─── */

function updateNavUI() {
  if (!currentUser) return;

  // Avatar
  var av = document.getElementById('nav-av');
  if (av) {
    av.textContent       = currentUser.initials || '?';
    av.style.background  = currentUser.bg;
    av.style.color       = currentUser.color;
  }

  // Nom
  var nm = document.getElementById('nav-name');
  if (nm) nm.textContent = currentUser.name;

  // Handicap
  var hcp = document.getElementById('nav-hcp');
  if (hcp) {
    hcp.textContent = (currentUser.hcp !== null && currentUser.hcp !== undefined)
      ? currentUser.hcp
      : '\u2014';
  }

  // Badge rôle
  var rb = document.getElementById('nav-role');
  if (rb) {
    rb.textContent = ROLE_LABELS[currentUser.role] || currentUser.role;
    rb.className   = 'nav-role-badge ' + (ROLE_CSS[currentUser.role] || 'role-player');
  }

  // Clic sur l'utilisateur = déconnexion
  var navUser = document.getElementById('nav-user');
  if (navUser) {
    // Supprimer l'ancien listener s'il existe
    var newUser = navUser.cloneNode(true);
    navUser.parentNode.replaceChild(newUser, navUser);
    document.getElementById('nav-user').addEventListener('click', function() {
      if (confirm('Se d\u00e9connecter ?')) doLogout();
    });
  }
}

/* ─── BUILD NAV TABS ─── */

function buildNavTabs() {
  var container = document.getElementById('nav-tabs');
  if (!container) return;

  // Vider
  while (container.firstChild) container.removeChild(container.firstChild);

  NAV_TABS.forEach(function(tab) {
    var btn = document.createElement('button');
    btn.className = 'nav-tab';
    btn.setAttribute('data-page', tab.page);

    var icon = document.createElement('span');
    icon.className = 'nav-tab-icon';
    icon.innerHTML = tab.icon;

    var label = document.createElement('span');
    label.textContent = tab.label;

    btn.appendChild(icon);
    btn.appendChild(label);

    btn.addEventListener('click', (function(page) {
      return function() { showPage(page); };
    })(tab.page));

    container.appendChild(btn);
  });
}

/* ─── BUILD PAGES ─── */

function buildPages() {
  var content = document.getElementById('app-content');
  if (!content) return;

  // Vider
  while (content.firstChild) content.removeChild(content.firstChild);

  NAV_TABS.forEach(function(tab) {
    var page = document.createElement('div');
    page.className = 'app-page';
    page.id = 'page-' + tab.page;

    // Initialiser chaque page dans un try/catch
    try {
      if (tab.page === 'dashboard') {
        buildDashboard(page);
      } else if (tab.page === 'scorecard') {
        // Scorecard initialisée séparément via initScorecardPage()
        // Ne rien mettre ici — elle sera remplie après
      } else {
        buildComingSoon(page, tab.label);
      }
    } catch(e) {
      console.warn('[TSG] Erreur init page ' + tab.page + ':', e.message);
      buildComingSoon(page, tab.label);
    }

    content.appendChild(page);
  });
}

/* ─── SHOW PAGE ─── */

function showPage(pageId) {
  // Désactiver tous les onglets et pages
  var tabs  = document.querySelectorAll('.nav-tab');
  var pages = document.querySelectorAll('.app-page');

  for (var i = 0; i < tabs.length; i++)  tabs[i].classList.remove('active');
  for (var j = 0; j < pages.length; j++) pages[j].classList.remove('active');

  // Activer l'onglet
  var tabs2 = document.querySelectorAll('.nav-tab');
  for (var k = 0; k < tabs2.length; k++) {
    if (tabs2[k].getAttribute('data-page') === pageId) {
      tabs2[k].classList.add('active');
      break;
    }
  }

  // Activer la page
  var target = document.getElementById('page-' + pageId);
  if (target) target.classList.add('active');

  // Si on revient sur le dashboard : reconstruire pour avoir les vraies données
  if (pageId === 'dashboard' && target && typeof buildDashboard === 'function') {
    try {
      while (target.firstChild) target.removeChild(target.firstChild);
      buildDashboard(target);
    } catch(e) { console.warn('Dashboard rebuild:', e.message); }
  }
}

/* ─── PAGE DASHBOARD (placeholder jusqu'à la Session 2) ─── */



/* Chart registry */
var _dashCharts = {};
function _destroyDashCharts() {
  // Méthode la plus robuste : détruire TOUTES les instances Chart.js existantes
  // (peu importe à quel canvas elles sont attachées)
  if (typeof Chart !== 'undefined') {
    // Chart.js v4 garde les instances dans Chart.instances (objet)
    if (Chart.instances) {
      Object.keys(Chart.instances).forEach(function(key) {
        try { Chart.instances[key].destroy(); } catch(ex) {}
      });
    }
    // Fallback : itérer les canvas connus et détruire via getChart
    if (Chart.getChart) {
      ['dash-score-chart', 'dash-hcp-chart'].forEach(function(id) {
        var canvas = document.getElementById(id);
        if (canvas) {
          var existing = Chart.getChart(canvas);
          if (existing) { try { existing.destroy(); } catch(e) {} }
        }
      });
    }
  }
  // Vider notre registry locale
  Object.keys(_dashCharts).forEach(function(k) { delete _dashCharts[k]; });
}
function initDashboard() {
  var pg = document.getElementById('page-dashboard');
  if (!pg) return;
  _destroyDashCharts();
  pg.innerHTML = '';
  try { buildDashboard(pg); } catch(ex) { console.warn('Dashboard:', ex.message); }
}

function buildDashboard(container) {
  // CRITIQUE : détruire les anciens graphiques Chart.js avant d'en créer de nouveaux
  // Sinon Chart.js refuse de réutiliser le canvas → graphiques absents
  if (typeof _destroyDashCharts === 'function') _destroyDashCharts();

  var u = currentUser || {};
  var firstName = u.name ? u.name.split(' ')[0] : 'Golfeur';

  /* ── Données : vraies parties ou démo ── */
  var rounds = lsGet('rounds') || [];
  var hasReal = rounds.length > 0;

  /* Données de démo si aucune partie saisie */
  var DEMO = [
    {score:88,gir:4,fir:7,putts:36,sg_tee:-0.4,sg_app:-0.2,sg_arg:-0.1,sg_putt:-0.3,diff:14.8},
    {score:86,gir:5,fir:8,putts:35,sg_tee:-0.3,sg_app:-0.1,sg_arg: 0.1,sg_putt:-0.2,diff:13.9},
    {score:85,gir:6,fir:9,putts:34,sg_tee:-0.2,sg_app: 0.1,sg_arg: 0.2,sg_putt:-0.1,diff:13.2},
    {score:84,gir:6,fir:9,putts:34,sg_tee:-0.1,sg_app: 0.2,sg_arg: 0.1,sg_putt: 0.0,diff:12.8},
    {score:87,gir:5,fir:8,putts:35,sg_tee:-0.3,sg_app:-0.1,sg_arg:-0.1,sg_putt:-0.2,diff:13.6},
    {score:83,gir:7,fir:10,putts:33,sg_tee: 0.1,sg_app: 0.3,sg_arg: 0.2,sg_putt: 0.1,diff:12.1},
    {score:82,gir:7,fir:10,putts:33,sg_tee: 0.2,sg_app: 0.4,sg_arg: 0.2,sg_putt: 0.1,diff:11.8},
    {score:84,gir:6,fir:9, putts:34,sg_tee: 0.0,sg_app: 0.2,sg_arg: 0.1,sg_putt: 0.0,diff:12.5},
    {score:81,gir:8,fir:11,putts:32,sg_tee: 0.3,sg_app: 0.5,sg_arg: 0.3,sg_putt: 0.2,diff:11.2},
    {score:80,gir:8,fir:11,putts:32,sg_tee: 0.4,sg_app: 0.5,sg_arg: 0.3,sg_putt: 0.2,diff:10.9},
    {score:82,gir:7,fir:10,putts:33,sg_tee: 0.2,sg_app: 0.3,sg_arg: 0.2,sg_putt: 0.1,diff:11.6},
    {score:79,gir:9,fir:12,putts:31,sg_tee: 0.5,sg_app: 0.6,sg_arg: 0.4,sg_putt: 0.3,diff:10.4}
  ];

  // rounds est trié du plus récent au plus ancien (unshift dans saveRound)
  // On prend les 12 premiers et on inverse pour avoir chronologique
  var data = hasReal ? rounds.slice(0, 12).reverse() : DEMO;
  var n = data.length;

  /* ── Calculs KPIs ── */
  function avg(arr, key) {
    var sum = 0, cnt = 0;
    arr.forEach(function(r) { if (r[key] !== undefined && r[key] !== null) { sum += r[key]; cnt++; } });
    return cnt ? sum / cnt : 0;
  }

  var avgScore  = avg(data, 'score').toFixed(1);
  var avgGIR    = (avg(data, 'gir') / 18 * 100).toFixed(0);
  var avgFIR    = (avg(data, 'fir') / 14 * 100).toFixed(0);
  var avgPutts  = avg(data, 'putts').toFixed(1);
  var hcp       = u.hcp !== null && u.hcp !== undefined ? u.hcp : 14.2;

  /* Strokes Gained */
  var sg_tee  = avg(data, 'sg_tee').toFixed(2);
  var sg_app  = avg(data, 'sg_app').toFixed(2);
  var sg_arg  = avg(data, 'sg_arg').toFixed(2);
  var sg_putt = avg(data, 'sg_putt').toFixed(2);

  /* Tendances (3 dernières vs 3 précédentes) */
  function trend(key) {
    if (data.length < 6) return 0;
    var last3 = data.slice(-3); var prev3 = data.slice(-6, -3);
    return avg(last3, key) - avg(prev3, key);
  }

  var tScore = trend('score');
  var tGIR   = trend('gir');

  /* Graphiques data */
  var scoreHistory = data.map(function(r) { return r.score; });
  var hcpHistory   = data.map(function(r, i) {
    return r.diff !== undefined ? r.diff : (parseFloat(hcp) + (n - i - 1) * 0.2).toFixed(1);
  });

  /* ── Démo messages ── */
  var MESSAGES = [
    { type:'public', channel:'Equipe', icon:'#', from:'Martin Dubois', text:'Super partie hier Thomas ! Continue comme ça.', time:'Il y a 2h', unread:true },
    { type:'private', channel:'Coach', icon:null, from:'Martin Dubois', av:'MD', color:'#EF9F27', bg:'rgba(239,159,39,0.15)', text:'Ton analyse de la semaine est prête. Regarde le secteur approche.', time:'Il y a 5h', unread:true },
    { type:'group', channel:'Comp. Régionale', icon:'@', from:'Sophie Laurent', text:'Rappel : départ samedi à 9h00, trou 1.', time:'Hier', unread:false }
  ];

  /* ══════════════════════════════════════
     CONSTRUCTION HTML avec createElement
     (pas de strings innerHTML cliquables)
  ══════════════════════════════════════ */
  var wrap = document.createElement('div');
  wrap.className = 'dash-wrap';

  /* ── 1. HEADER ── */
  var header = document.createElement('div');
  header.className = 'dash-header';

  var headerLeft = document.createElement('div');
  var greeting = document.createElement('div');
  greeting.className = 'dash-greeting';
  greeting.textContent = 'Bonjour, ' + firstName;
  var meta = document.createElement('div');
  meta.className = 'dash-meta';
  meta.textContent = 'Saison ' + new Date().getFullYear() + ' \u00b7 ' + n + ' parties ' + (hasReal ? 'enregistr\u00e9es' : 'de d\u00e9mo');
  headerLeft.appendChild(greeting);
  headerLeft.appendChild(meta);

  var headerRight = document.createElement('div');
  headerRight.style.display = 'flex';
  headerRight.style.gap = '8px';

  var btnScorecard = document.createElement('button');
  btnScorecard.className = 'dash-btn dash-btn-outline';
  btnScorecard.textContent = '+ Nouvelle partie';
  btnScorecard.addEventListener('click', function() { showPage('scorecard'); });

  var btnAnalyse = document.createElement('button');
  btnAnalyse.className = 'dash-btn dash-btn-gold';
  btnAnalyse.textContent = 'Voir l\'analyse \u2192';
  btnAnalyse.addEventListener('click', function() { showPage('analyse'); });

  headerRight.appendChild(btnScorecard);
  headerRight.appendChild(btnAnalyse);

  header.appendChild(headerLeft);
  header.appendChild(headerRight);
  wrap.appendChild(header);

  /* ── 2. BANNIÈRE DÉMO (si pas de vraies données) ── */
  if (!hasReal) {
    var banner = document.createElement('div');
    banner.className = 'demo-banner';
    banner.innerHTML = '<span class="demo-banner-icon">\u2139\uFE0F</span><span><strong>Donn\u00e9es de d\u00e9mo</strong> \u2014 Jouez une partie et saisissez-la dans la Scorecard pour voir vos vraies statistiques appara\u00eetre ici.</span>';
    wrap.appendChild(banner);
  }

  /* ── 3. KPIs PRINCIPAUX (5 cards) ── */
  var kpiData = [
    { label: 'Score moyen',       value: avgScore,        trend: tScore, worse: true  },
    { label: 'GIR',               value: avgGIR + '%',    trend: tGIR,   worse: false },
    { label: 'FIR',               value: avgFIR + '%',    trend: 0,      worse: false },
    { label: 'Putts / tour',      value: avgPutts,        trend: 0,      worse: true  },
    { label: 'Handicap actuel',   value: hcp,             trend: 0,      worse: true  }
  ];

  var kpiGrid = document.createElement('div');

/* ─── LOGOUT ─── */

function doLogout() {
  currentUser     = null;
  selectedProfile = null;

  var appEl   = document.getElementById('app');
  var loginEl = document.getElementById('login-screen');

  if (appEl)   appEl.classList.remove('visible');
  if (loginEl) loginEl.style.display = 'flex';

  // Nettoyer le formulaire
  var nameEl = document.getElementById('inp-name');
  var hcpEl  = document.getElementById('inp-hcp');
  if (nameEl) nameEl.value = '';
  if (hcpEl)  hcpEl.value  = '';

  // Reconstruire les profils
  buildProfiles();

  showToast('D\u00e9connect\u00e9 avec succ\u00e8s');
}

/* ─── CLAVIER ─── */

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var appEl = document.getElementById('app');
    if (appEl && appEl.classList.contains('visible')) {
      if (confirm('Se d\u00e9connecter ?')) doLogout();
    }
  }
});

/* ─── BOUTON LOGIN ─── */

var btnEnter = document.getElementById('btn-enter');
if (btnEnter) {
  btnEnter.addEventListener('click', function() {
    doLogin();
  });

function renderCourseList(list) {
  const el = document.getElementById('course-list');
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<div style="padding:12px;font-size:10px;color:var(--tx3);text-align:center">Aucun résultat</div>'; return; }
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'course-item' + (selectedCourse && selectedCourse.id === c.id ? ' selected' : '');
    div.setAttribute('data-course-id', c.id);
    div.onclick = () => selectCourse(c);
    const lvlClass = c.niveau.toLowerCase().replace('é','e').replace('è','e').replace('â','a');
    div.innerHTML = `<div class="ci-name">${c.name}</div>
      <div class="ci-meta">
        <span>${c.ville}</span>
        <span>Par ${c.par_total}</span>
        <span>Slope ${c.slope}</span>
        <span class="ci-tag ${lvlClass}">${c.niveau}</span>
      </div>`;
    el.appendChild(div);
  });
}

function filterCourses() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let list = COURSES.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.ville.toLowerCase().includes(q) ||
    c.region.toLowerCase().includes(q) ||
    c.departement.toLowerCase().includes(q)
  );
  if (activeFilter !== 'all') {
    list = list.filter(c => c.region === activeFilter || c.niveau === activeFilter);
  }
  renderCourseList(list);
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filterCourses();
}

function selectCourse(c) {
  selectedCourse = c;
  document.querySelectorAll('.course-item').forEach(el => el.classList.remove('selected'));
  // Retrouver l'élément du parcours sélectionné
  var allItems = document.querySelectorAll('.course-item');
  allItems.forEach(function(el) {
    if (el.getAttribute('data-course-id') === c.id) el.classList.add('selected');
  });

  // Update course card
  document.getElementById('course-card').classList.add('visible');
  document.getElementById('cc-name').textContent = c.name;
  document.getElementById('cc-loc').textContent = `${c.ville} · ${c.departement} · ${c.region}`;
  document.getElementById('cc-par').textContent = c.par_total;
  document.getElementById('cc-sss').textContent = c.sss;
  document.getElementById('cc-slope').textContent = c.slope;
  document.getElementById('cc-len').textContent = c.longueur_totale + 'm';
  document.getElementById('cc-rating').textContent = c.rating.toFixed(1);
  document.getElementById('cc-diff-val').textContent = c.niveau;

  const lenPct = Math.round((c.longueur_totale - 5000) / (7000 - 5000) * 100);
  const diffPct = {Débutant:20, Intermédiaire:50, Difficile:75, Expert:95}[c.niveau] || 50;
  const ratingPct = Math.round((c.rating - 65) / (80 - 65) * 100);
  document.getElementById('cc-len-bar').style.width = Math.max(5, lenPct) + '%';
  document.getElementById('cc-diff-bar').style.width = diffPct + '%';
  document.getElementById('cc-rating-bar').style.width = Math.max(5, ratingPct) + '%';

  var btnStart = document.getElementById('btn-start');
  if (btnStart) {
    btnStart.disabled = false;
    btnStart.textContent = 'Démarrer la partie →';
  }
}

function buildTable(tableId, holes) {
  const table = document.getElementById(tableId);
  table.innerHTML = '';

  // Header
  const thead = document.createElement('thead');
  const htr = document.createElement('tr');
  ['Trou','Par','SI','Distance','Score','Stableford'].forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);

  // Body
  const tbody = document.createElement('tbody');
  holes.forEach(h => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${h.num}</td>
      <td class="par-cell">${h.par}</td>
      <td class="si-cell">${h.si}</td>
      <td class="dist-cell">${h.longueur}m</td>
      <td class="score-cell">
        <input class="score-inp" type="number" min="1" max="12" id="sc-${h.num}"
          placeholder="${h.par}" oninput="onScoreInput(${h.num},${h.par},this)">
      </td>
      <td class="stableford-cell" id="stab-${h.num}" style="color:var(--tx3)">—</td>`;
    tbody.appendChild(tr);
  });

  // Total row
  const totalTr = document.createElement('tr');
  totalTr.className = 'total-row';
  const half = tableId === 'table-aller' ? 'aller' : 'retour';
  totalTr.innerHTML = `
    <td>Total</td>
    <td id="par-${half}-tot" style="color:var(--gold)">—</td>
    <td></td>
    <td id="dist-${half}-tot" style="font-size:9px;color:var(--tx3)">—m</td>
    <td id="score-${half}-tot" style="color:var(--tx)">—</td>
    <td id="stab-${half}-tot" style="color:var(--gold)">—</td>`;
  tbody.appendChild(totalTr);
  table.appendChild(tbody);
}

// ── SCORE LOGIC ──
function onScoreInput(num, par, inp) {
  const v = inp.value ? parseInt(inp.value) : null;
  scores[num - 1] = v;
  inp.className = 'score-inp ' + getScoreClass(v, par);

  // Stableford
  const stabCell = document.getElementById(`stab-${num}`);
  if (v !== null) {
    const hcp = parseFloat(document.getElementById('f-hcp').value) || 14.2;
    const si = selectedCourse.trous[num-1].si;
    const strokes = Math.floor(hcp / 18) + (si <= (hcp % 18) ? 1 : 0);
    const net = v - par + strokes;
    const pts = Math.max(0, 2 - net);
    stabCell.textContent = pts;
    stabCell.style.color = pts >= 3 ? 'var(--gold-l)' : pts === 2 ? 'var(--ok2)' : pts === 1 ? 'var(--tx2)' : 'var(--ng2)';
  } else {
    stabCell.textContent = '—';
    stabCell.style.color = 'var(--tx3)';
  }

  updateTotals();
}

function onPuttInput(num, inp) {
  putts[num - 1] = inp.value ? parseInt(inp.value) : null;
  updateStats();
}

function getScoreClass(v, par) {
  if (v === null) return '';
  const d = v - par;
  if (d <= -2) return 'eagle';
  if (d === -1) return 'birdie';
  if (d === 0) return 'par-s';
  if (d === 1) return 'bogey';
  if (d === 2) return 'double';
  return 'triple';
}

function toggleFir(num) {
  const states = [null, 'hit', 'miss'];
  const cur = firState[num] || null;
  const next = states[(states.indexOf(cur) + 1) % 3];
  firState[num] = next;
  const cell = document.getElementById(`fir-${num}`);
  cell.className = 'toggle-cell' + (next ? ' ' + next : '');
  const h = selectedCourse.trous[num-1];
  cell.innerHTML = `<span class="hole-n">${num}</span>${next === 'hit' ? '✓' : next === 'miss' ? '✗' : '—'}`;
  updateStats();
}

function toggleGir(num) {
  const states = [null, 'hit', 'miss'];
  const cur = girState[num] || null;
  const next = states[(states.indexOf(cur) + 1) % 3];
  girState[num] = next;
  const cell = document.getElementById(`gir-${num}`);
  cell.className = 'toggle-cell' + (next ? ' ' + next : '');
  cell.innerHTML = `<span class="hole-n">${num}</span>${next === 'hit' ? '✓' : next === 'miss' ? '✗' : '—'}`;
  updateStats();
}


/* null-safe element setter */
function setEl(id, text, style) {
  var el = document.getElementById(id);
  if (!el) return;
  if (text !== undefined) el.textContent = text;
  if (style) Object.assign(el.style, style);
}

function updateTotals() {
  if (!selectedCourse) return;
  const trous = selectedCourse.trous;

  const parAller = trous.slice(0,9).reduce((a,h) => a+h.par, 0);
  const parRetour = trous.slice(9).reduce((a,h) => a+h.par, 0);
  setEl('par-aller-tot', parAller);
  setEl('par-retour-tot', parRetour);
  setEl('par-aller-display', parAller);
  setEl('par-retour-display', parRetour);

  const distAller = trous.slice(0,9).reduce((a,h) => a+h.longueur, 0);
  const distRetour = trous.slice(9).reduce((a,h) => a+h.longueur, 0);
  setEl('dist-aller-tot', distAller + 'm');
  setEl('dist-retour-tot', distRetour + 'm');

  const scoreAller = scores.slice(0,9).reduce((a,s) => s!==null ? a+s : a, 0);
  const scoreRetour = scores.slice(9).reduce((a,s) => s!==null ? a+s : a, 0);
  const filledAller = scores.slice(0,9).filter(s=>s!==null).length;
  const filledRetour = scores.slice(9).filter(s=>s!==null).length;
  const scoreTotal = scoreAller + scoreRetour;
  const parTotal = selectedCourse.par_total;

  if (filledAller > 0) { setEl('score-aller-tot', scoreAller); setEl('score-aller-display', scoreAller); }
  if (filledRetour > 0) { setEl('score-retour-tot', scoreRetour); setEl('score-retour-display', scoreRetour); }

  // Stableford totals
  const stabAller = Array.from({length:9},(_,i)=>{
    const el = document.getElementById(`stab-${i+1}`);
    return el && el.textContent !== '—' ? parseInt(el.textContent)||0 : 0;
  }).reduce((a,b)=>a+b,0);
  const stabRetour = Array.from({length:9},(_,i)=>{
    const el = document.getElementById(`stab-${i+10}`);
    return el && el.textContent !== '—' ? parseInt(el.textContent)||0 : 0;
  }).reduce((a,b)=>a+b,0);
  if (filledAller > 0) setEl('stab-aller-tot', stabAller);
  if (filledRetour > 0) setEl('stab-retour-tot', stabRetour);

  const stabTotal = stabAller + stabRetour;
  const filledTotal = filledAller + filledRetour;

  if (filledTotal > 0) {
    const vsPar = scoreTotal - parTotal;
    setEl('sh-score', scoreTotal);
    setEl('sh-vs-par', (vsPar >= 0 ? '+' : '') + vsPar);
    setEl('sh-vs-par', undefined, {color:vsPar < 0 ? 'var(--ok2)' : vsPar === 0 ? 'var(--gold)' : 'var(--wn2)'});
    setEl('sh-stab', stabTotal);

    // Différentiel
    const diff = ((scoreTotal - selectedCourse.rating) * 113 / selectedCourse.slope).toFixed(1);
    setEl('sh-diff', diff);

    // Summary
    setEl('sum-score', scoreTotal);
    setEl('sum-score-sub', (vsPar >= 0 ? '+' : '') + vsPar + ' vs par');
    (function(){ var _e=document.getElementById('sum-score'); if(_e) _e.className='sum-val ' + (vsPar < 0 ? 'ok' : vsPar <= 5 ? 'wn' : 'ng'); })();
    setEl('sum-stab', stabTotal);
    setEl('sum-diff', diff);
  }

  // Distribution
  if (filledTotal >= 6) updateAnalysis();
  updateDiffRow();
}

function updateDiffRow() {
  const counts = {eagle:0, birdie:0, par:0, bogey:0, double:0, triple:0};
  scores.forEach((s,i) => {
    if (s === null) return;
    const par = selectedCourse.trous[i].par;
    const d = s - par;
    if (d <= -2) counts.eagle++;
    else if (d === -1) counts.birdie++;
    else if (d === 0) counts.par++;
    else if (d === 1) counts.bogey++;
    else if (d === 2) counts.double++;
    else counts.triple++;
  });
  const row = document.getElementById('diff-row');
  row.innerHTML = `
    ${counts.eagle ? `<span class="diff-pill pill-eagle">Eagle ×${counts.eagle}</span>` : ''}
    ${counts.birdie ? `<span class="diff-pill pill-birdie">Birdie ×${counts.birdie}</span>` : ''}
    ${counts.par ? `<span class="diff-pill pill-par">Par ×${counts.par}</span>` : ''}

function updateStats() {
  if (!selectedCourse) return;
  // Met à jour les insights d'analyse en temps réel
  try { updateAnalysis(); } catch(e) {}
  try { updateTotals(); } catch(e) {}
}

function updateAnalysis() {
  const firHit = Object.values(firState).filter(v=>v==='hit').length;
  const firTotal = selectedCourse.trous.filter(h=>h.par!==3).length;
  const girHit = Object.values(girState).filter(v=>v==='hit').length;
  const puttsTotal = putts.reduce((a,p)=>p!==null?a+p:a, 0);
  const scoreTotal = scores.reduce((a,s)=>s!==null?a+s:a, 0);
  const par = selectedCourse.par_total;
  const diff = ((scoreTotal - selectedCourse.rating) * 113 / selectedCourse.slope);

  const bogeys = scores.filter((s,i)=>s!==null&&s-selectedCourse.trous[i].par===1).length;
  const doubles = scores.filter((s,i)=>s!==null&&s-selectedCourse.trous[i].par>=2).length;

  const cont = document.getElementById('analysis-content');
  if (!cont) return;
  cont.innerHTML = `
    <div class="insight-block">
      <div class="insight-title">Score global</div>
      <div class="insight-body">Score de <strong>${scoreTotal}</strong> (${scoreTotal>par?'+':''}${scoreTotal-par}) · Différentiel <strong>${diff.toFixed(1)}</strong>.
      ${diff < parseFloat(document.getElementById('f-hcp').value) ? 'Partie <strong>sous votre handicap</strong> — score comptable favorable.' : 'Partie au-dessus de votre indice habituel.'}</div>
    </div>
    <div class="insight-block">
      <div class="insight-title">Distribution des scores</div>
      <div class="insight-body"><strong>${bogeys} bogeys</strong> et <strong>${doubles} doubles+</strong> sur ce tour. ${doubles >= 3 ? 'Les grandes erreurs coûtent <strong>~'+Math.round(doubles*1.3)+' coups</strong> au total.' : doubles <= 1 ? 'Excellente gestion des erreurs critiques.' : 'Contrôle correct des grandes erreurs.'}</div>
    </div>
    <div class="insight-block">
      <div class="insight-title">GIR & Approches</div>
      <div class="insight-body">GIR à <strong>${girHit}/18 (${Math.round(girHit/18*100)}%)</strong>. ${girHit >= 9 ? 'Niveau d\'approche au-dessus de votre handicap.' : girHit >= 6 ? 'Marge de progression sur les fers.' : '<strong>Axe prioritaire</strong> — chaque GIR supplémentaire vaut ~0.7 coup.'}</div>
    </div>
    <div class="insight-block">
      <div class="insight-title">Précision tee & Fairways</div>
      <div class="insight-body">FIR à <strong>${firHit}/${firTotal} (${Math.round(firHit/firTotal*100)}%)</strong>. ${firHit/firTotal >= .6 ? 'Bonne précision en jeu — driver sous contrôle.' : firHit/firTotal >= .4 ? 'Précision acceptable — optimisable par choix de club.' : '<strong>Priorité driver</strong> — FIR faible amplifie toutes les erreurs suivantes.'}</div>
    </div>
    ${puttsTotal > 0 ? `<div class="insight-block">
      <div class="insight-title">Putting</div>
      <div class="insight-body">Total <strong>${puttsTotal} putts</strong> sur ce tour. ${puttsTotal <= 30 ? 'Putting excellent — atout majeur de ce tour.' : puttsTotal <= 34 ? 'Niveau standard — stable.' : '<strong>Putting coûteux</strong> : '+(puttsTotal-32)+' putts de trop vs référence hcp 14.'}</div>
    </div>` : ''}
    <div class="insight-block">
      <div class="insight-title">Contexte parcours</div>
      <div class="insight-body">Slope <strong>${selectedCourse.slope}</strong> — ${selectedCourse.slope >= 135 ? 'parcours difficile · score à relativiser positivement.' : selectedCourse.slope >= 125 ? 'difficulté standard.' : 'parcours accessible · exigence élevée sur la performance.'} Rating <strong>${selectedCourse.rating}</strong>.</div>
    </div>`;
}

function startRound() {
  if (!selectedCourse) return;
  roundStarted = true;
  scores = new Array(18).fill(null);
  putts = new Array(18).fill(null);
  firState = {};
  girState = {};

  document.getElementById('sc-empty').style.display = 'none';
  const area = document.getElementById('round-area');
  area.style.display = 'flex';

  // Header
  document.getElementById('sc-course-name').textContent = selectedCourse.name;
  var dateEl   = document.getElementById('f-date');
  var teeEl    = document.getElementById('f-tee');
  var condEl   = document.getElementById('f-cond');
  document.getElementById('sc-course-meta').textContent = selectedCourse.ville + ' · ' + selectedCourse.departement + ' · ' + (dateEl ? dateEl.value : '') + ' · ' + (teeEl ? teeEl.value : '') + ' · ' + (condEl ? condEl.options[condEl.selectedIndex].text : '');

  const info = document.getElementById('sc-header-info');
  info.innerHTML = `
    <div class="info-pill">Par <strong>${selectedCourse.par_total}</strong></div>
    <div class="info-pill">SSS <strong>${selectedCourse.sss}</strong></div>
    <div class="info-pill">Slope <strong>${selectedCourse.slope}</strong></div>
    <div class="info-pill">Rating <strong>${selectedCourse.rating}</strong></div>
    <div class="info-pill">Longueur <strong>${selectedCourse.longueur_totale}m</strong></div>
    <div class="info-pill">Niveau <strong>${selectedCourse.niveau}</strong></div>
    <div class="info-pill">Format <strong>${document.getElementById('f-format').options[document.getElementById('f-format').selectedIndex].text}</strong></div>
    <div class="info-pill">Hcp joué <strong>${document.getElementById('f-hcp').value}</strong></div>`;

  buildTable('table-aller', selectedCourse.trous.slice(0,9));
  buildTable('table-retour', selectedCourse.trous.slice(9));
  buildFirGirToggles(selectedCourse);
  buildPuttsInputs(selectedCourse);

  showToast('Partie démarrée — ' + selectedCourse.name);
  setTimeout(() => area.scrollIntoView({behavior:'smooth'}), 100);
}

function resetRound() {
  if (!confirm('Réinitialiser tous les scores ?')) return;
  scores = new Array(18).fill(null);
  putts = new Array(18).fill(null);
  firState = {};
  girState = {};
  document.querySelectorAll('.score-inp').forEach(i => { i.value = ''; i.className = 'score-inp'; });
  document.querySelectorAll('.stableford-cell').forEach(c => { c.textContent = '—'; c.style.color = 'var(--tx3)'; });
  document.querySelectorAll('[id^="putt-"]').forEach(i => i.value = '');
  document.querySelectorAll('.toggle-cell').forEach(c => { c.className='toggle-cell'; });
  buildFirGirToggles(selectedCourse);
  buildPuttsInputs(selectedCourse);
  ['sh-score','sh-vs-par','sh-stab','sh-diff'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent='—'; });
  var dr=document.getElementById('diff-row'); if(dr) dr.innerHTML='';
  var ac=document.getElementById('analysis-content'); if(ac) ac.innerHTML='';
  var ss=document.getElementById('save-status'); if(ss) ss.textContent='Partie réinitialisée';
  showToast('Scorecard réinitialisée');
}

function saveRound() {
  const filledScores = scores.filter(s=>s!==null).length;
  if (filledScores < 9) { showToast('Saisissez au moins 9 trous avant d\'enregistrer.'); return; }

  const scoreTotal = scores.reduce((a,s)=>s!==null?a+s:a, 0);
  const par = selectedCourse.par_total;
  const diff = ((scoreTotal - selectedCourse.rating) * 113 / selectedCourse.slope).toFixed(1);
  const firHit = Object.values(firState).filter(v=>v==='hit').length;
  const girHit = Object.values(girState).filter(v=>v==='hit').length;
  const puttsTotal = putts.reduce((a,p)=>p!==null?a+p:a, 0);

  const entry = {
    id: Date.now(),
    date: document.getElementById('f-date').value,
    course: selectedCourse.name,
    courseId: selectedCourse.id,
    score: scoreTotal,
    par: par,
    diff: parseFloat(diff),
    fir: firHit,
    firTotal: selectedCourse.trous.filter(h=>h.par!==3).length,
    gir: girHit,
    putts: puttsTotal || null,
    cond: document.getElementById('f-cond').value,
    format: document.getElementById('f-format').value,
    hcp: parseFloat(document.getElementById('f-hcp').value),
    notes: document.getElementById('f-notes').value,
    scores: [...scores],
    sg_tee:  parseFloat((((firHit / (selectedCourse.trous.filter(function(h){return h.par!==3;}).length||14)) - 0.5) * 1.2).toFixed(2)),
    sg_app:  parseFloat((((girHit / 18) - 0.38) * 2.1).toFixed(2)),
    sg_arg:  parseFloat(((girHit / 18) >= 0.5 ? 0.1 : -0.1).toFixed(2)),
    sg_putt: parseFloat((puttsTotal > 0 ? ((32 - puttsTotal) * 0.15) : 0).toFixed(2))
  };

  roundHistory.unshift(entry);
  if (roundHistory.length > 50) roundHistory.pop();
  // Save to shared key so dashboard can read it
  lsSet('rounds', roundHistory);

  var statusEl = document.getElementById('save-status');
  if (statusEl) statusEl.textContent = 'Partie enregistrée — ' + entry.date;
  var histSec = document.getElementById('roundHistory-section');
  if (histSec) histSec.style.display = 'flex';
  renderHistory();
  showToast('Partie enregistrée ✓  ' + entry.date + ' · ' + entry.course + ' · ' + scoreTotal + ' (+'+(scoreTotal-par)+')');
  // Rediriger vers le dashboard et rebuild
  setTimeout(function() {
    try {
      var dashPage = document.getElementById('page-dashboard');
      if (dashPage && typeof buildDashboard === 'function') {
        while (dashPage.firstChild) dashPage.removeChild(dashPage.firstChild);
        buildDashboard(dashPage);
      }
      showPage('dashboard');
    } catch(ex) { console.warn('save redirect:', ex.message); }
  }, 800);
}

function renderHistory() {
  if (!roundHistory.length) return;
  var section = document.getElementById('roundHistory-section');
  if (section) section.style.display = 'flex';
  var titleEl = document.getElementById('hist-title');
  if (titleEl) titleEl.style.display = 'block';
  // L'ID peut être 'roundHistory-list' ou 'history-list' selon les versions
  var cont = document.getElementById('roundHistory-list') || document.getElementById('history-list');
  if (!cont) return;
  cont.innerHTML = roundHistory.slice(0,5).map(e => {
    const vsPar = e.score - e.par;
    const col = vsPar < 0 ? 'var(--ok2)' : vsPar <= 7 ? 'var(--wn2)' : 'var(--ng2)';
    return `<div class="roundHistory-row">
      <div class="hr-date">${e.date}</div>
      <div class="hr-course" style="font-size:10px">${e.course}</div>
      <div class="hr-score" style="color:${col}">${e.score}</div>
      <div class="hr-diff" style="color:${vsPar>=0?'var(--wn2)':'var(--ok2)'}">${vsPar>=0?'+':''}${vsPar}</div>
    </div>`;
  }).join('');
}

    if (saved && saved.length) {

      var ht = document.getElementById('hist-title');
      var hs = document.getElementById('roundHistory-section');
      if (ht) ht.style.display = 'block';
      if (hs) hs.style.display = 'flex';
      renderHistory();
    }
  } catch(e) {
    console.warn('[TSG] Scorecard init error:', e.message);
  }
}



(function init() {
  // Construire les profils dans le login
  buildProfiles();

  // Auto-login si un utilisateur est mémorisé
  var lastId = lsGet('lastUser');
  if (lastId) {
    var profiles = lsGet('profiles') || DEFAULT_PROFILES;
    for (var i = 0; i < profiles.length; i++) {
      if (profiles[i].id === lastId) {
        currentUser     = profiles[i];
        selectedProfile = profiles[i];
        launchApp();
        return;
      }
    }
  }
  // Sinon afficher le login
})();</script>
