// ── INIT ──



function renderCourseList(list) {
  const el = document.getElementById('course-list');
  if (!el) return;
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<div style="padding:12px;font-size:10px;color:var(--tx3);text-align:center">Aucun résultat</div>'; return; }
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'course-item' + (selectedCourse && selectedCourse.id === c.id ? ' selected' : '');
    div.setAttribute('data-course-id', c.id);
    div.onclick = () => selectCourse(c);
    const lvlClass = c.niveau.toLowerCase().replace('é','e').replace('è','e').replace('â','a');
    div.innerHTML = `<div class="ci-name">${c.name}</div>
      <div class="ci-meta">
        <span>${c.ville}</span>
        <span>Par ${c.par_total}</span>
        <span>Slope ${c.slope}</span>
        <span class="ci-tag ${lvlClass}">${c.niveau}</span>
      </div>`;
    el.appendChild(div);
  });
}

function filterCourses() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let list = COURSES.filter(c =>
    c.name.toLowerCase().includes(q) ||
    c.ville.toLowerCase().includes(q) ||
    c.region.toLowerCase().includes(q) ||
    c.departement.toLowerCase().includes(q)
  );
  if (activeFilter !== 'all') {
    list = list.filter(c => c.region === activeFilter || c.niveau === activeFilter);
  }
  renderCourseList(list);
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filterCourses();
}

function selectCourse(c) {
  selectedCourse = c;
  document.querySelectorAll('.course-item').forEach(el => el.classList.remove('selected'));
  // Retrouver l'élément du parcours sélectionné
  var allItems = document.querySelectorAll('.course-item');
  allItems.forEach(function(el) {
    if (el.getAttribute('data-course-id') === c.id) el.classList.add('selected');
  });

  // Update course card
  document.getElementById('course-card').classList.add('visible');
  document.getElementById('cc-name').textContent = c.name;
  document.getElementById('cc-loc').textContent = `${c.ville} · ${c.departement} · ${c.region}`;
  document.getElementById('cc-par').textContent = c.par_total;
  document.getElementById('cc-sss').textContent = c.sss;
  document.getElementById('cc-slope').textContent = c.slope;
  document.getElementById('cc-len').textContent = c.longueur_totale + 'm';
  document.getElementById('cc-rating').textContent = c.rating.toFixed(1);
  document.getElementById('cc-diff-val').textContent = c.niveau;

  const lenPct = Math.round((c.longueur_totale - 5000) / (7000 - 5000) * 100);
  const diffPct = {Débutant:20, Intermédiaire:50, Difficile:75, Expert:95}[c.niveau] || 50;
  const ratingPct = Math.round((c.rating - 65) / (80 - 65) * 100);
  document.getElementById('cc-len-bar').style.width = Math.max(5, lenPct) + '%';
  document.getElementById('cc-diff-bar').style.width = diffPct + '%';
  document.getElementById('cc-rating-bar').style.width = Math.max(5, ratingPct) + '%';

  var btnStart = document.getElementById('btn-start');
  if (btnStart) {
    btnStart.disabled = false;
    btnStart.textContent = 'Démarrer la partie →';
  }
}

  firCont.innerHTML = '';

  firCont.style.cssText = 'display:grid;grid-template-columns:repeat(9,1fr);gap:5px';

  course.trous.forEach(function(h) {

    girV.style.cssText = 'font-size:12px;font-weight:700';

    girCell.addEventListener('click', (function(num){ return function(){ toggleGir(num); }; })(h.num));
    girCont.appendChild(girCell);
  });
}

// ── SCORE LOGIC ──
function onScoreInput(num, par, inp) {
  const v = inp.value ? parseInt(inp.value) : null;
  scores[num - 1] = v;
  inp.className = 'score-inp ' + getScoreClass(v, par);

  // Stableford
  const stabCell = document.getElementById(`stab-${num}`);
  if (v !== null) {
    const hcp = parseFloat(document.getElementById('f-hcp').value) || 14.2;
    const si = selectedCourse.trous[num-1].si;
    const strokes = Math.floor(hcp / 18) + (si <= (hcp % 18) ? 1 : 0);
    const net = v - par + strokes;
    const pts = Math.max(0, 2 - net);
    stabCell.textContent = pts;
    stabCell.style.color = pts >= 3 ? 'var(--gold-l)' : pts === 2 ? 'var(--ok2)' : pts === 1 ? 'var(--tx2)' : 'var(--ng2)';
  } else {
    stabCell.textContent = '—';
    stabCell.style.color = 'var(--tx3)';
  }

  updateTotals();
}

function onPuttInput(num, inp) {
  putts[num - 1] = inp.value ? parseInt(inp.value) : null;
  updateStats();
}

function getScoreClass(v, par) {
  if (v === null) return '';
  const d = v - par;
  if (d <= -2) return 'eagle';
  if (d === -1) return 'birdie';
  if (d === 0) return 'par-s';
  if (d === 1) return 'bogey';
  if (d === 2) return 'double';
  return 'triple';
}

function toggleFir(num) {
  const states = [null, 'hit', 'miss'];
  const cur = firState[num] || null;
  const next = states[(states.indexOf(cur) + 1) % 3];
  firState[num] = next;
  const cell = document.getElementById(`fir-${num}`);
  cell.className = 'toggle-cell' + (next ? ' ' + next : '');
  const h = selectedCourse.trous[num-1];
  cell.innerHTML = `<span class="hole-n">${num}</span>${next === 'hit' ? '✓' : next === 'miss' ? '✗' : '—'}`;
  updateStats();
}

function toggleGir(num) {
  const states = [null, 'hit', 'miss'];
  const cur = girState[num] || null;
  const next = states[(states.indexOf(cur) + 1) % 3];
  girState[num] = next;
  const cell = document.getElementById(`gir-${num}`);
  cell.className = 'toggle-cell' + (next ? ' ' + next : '');
  cell.innerHTML = `<span class="hole-n">${num}</span>${next === 'hit' ? '✓' : next === 'miss' ? '✗' : '—'}`;
  updateStats();
}


/* null-safe element setter */
function setEl(id, text, style) {
  var el = document.getElementById(id);
  if (!el) return;
  if (text !== undefined) el.textContent = text;
  if (style) Object.assign(el.style, style);
}

function updateTotals() {
  if (!selectedCourse) return;
  const trous = selectedCourse.trous;

  const parAller = trous.slice(0,9).reduce((a,h) => a+h.par, 0);
  const parRetour = trous.slice(9).reduce((a,h) => a+h.par, 0);
  setEl('par-aller-tot', parAller);
  setEl('par-retour-tot', parRetour);
  setEl('par-aller-display', parAller);
  setEl('par-retour-display', parRetour);

  const distAller = trous.slice(0,9).reduce((a,h) => a+h.longueur, 0);
  const distRetour = trous.slice(9).reduce((a,h) => a+h.longueur, 0);
  setEl('dist-aller-tot', distAller + 'm');
  setEl('dist-retour-tot', distRetour + 'm');

  const scoreAller = scores.slice(0,9).reduce((a,s) => s!==null ? a+s : a, 0);
  const scoreRetour = scores.slice(9).reduce((a,s) => s!==null ? a+s : a, 0);
  const filledAller = scores.slice(0,9).filter(s=>s!==null).length;
  const filledRetour = scores.slice(9).filter(s=>s!==null).length;
  const scoreTotal = scoreAller + scoreRetour;
  const parTotal = selectedCourse.par_total;

  if (filledAller > 0) { setEl('score-aller-tot', scoreAller); setEl('score-aller-display', scoreAller); }
  if (filledRetour > 0) { setEl('score-retour-tot', scoreRetour); setEl('score-retour-display', scoreRetour); }

  // Stableford totals
  const stabAller = Array.from({length:9},(_,i)=>{
    const el = document.getElementById(`stab-${i+1}`);
    return el && el.textContent !== '—' ? parseInt(el.textContent)||0 : 0;
  }).reduce((a,b)=>a+b,0);
  const stabRetour = Array.from({length:9},(_,i)=>{
    const el = document.getElementById(`stab-${i+10}`);
    return el && el.textContent !== '—' ? parseInt(el.textContent)||0 : 0;
  }).reduce((a,b)=>a+b,0);
  if (filledAller > 0) setEl('stab-aller-tot', stabAller);
  if (filledRetour > 0) setEl('stab-retour-tot', stabRetour);

  const stabTotal = stabAller + stabRetour;
  const filledTotal = filledAller + filledRetour;

  if (filledTotal > 0) {
    const vsPar = scoreTotal - parTotal;
    setEl('sh-score', scoreTotal);
    setEl('sh-vs-par', (vsPar >= 0 ? '+' : '') + vsPar);
    setEl('sh-vs-par', undefined, {color:vsPar < 0 ? 'var(--ok2)' : vsPar === 0 ? 'var(--gold)' : 'var(--wn2)'});
    setEl('sh-stab', stabTotal);

    // Différentiel
    const diff = ((scoreTotal - selectedCourse.rating) * 113 / selectedCourse.slope).toFixed(1);
    setEl('sh-diff', diff);

    // Summary
    setEl('sum-score', scoreTotal);
    setEl('sum-score-sub', (vsPar >= 0 ? '+' : '') + vsPar + ' vs par');
    (function(){ var _e=document.getElementById('sum-score'); if(_e) _e.className='sum-val ' + (vsPar < 0 ? 'ok' : vsPar <= 5 ? 'wn' : 'ng'); })();
    setEl('sum-stab', stabTotal);
    setEl('sum-diff', diff);
  }

  // Distribution
  if (filledTotal >= 6) updateAnalysis();
  updateDiffRow();
}

function updateDiffRow() {
  const counts = {eagle:0, birdie:0, par:0, bogey:0, double:0, triple:0};
  scores.forEach((s,i) => {
    if (s === null) return;
    const par = selectedCourse.trous[i].par;
    const d = s - par;
    if (d <= -2) counts.eagle++;
    else if (d === -1) counts.birdie++;
    else if (d === 0) counts.par++;
    else if (d === 1) counts.bogey++;
    else if (d === 2) counts.double++;
    else counts.triple++;
  });
  const row = document.getElementById('diff-row');
  row.innerHTML = `
    ${counts.eagle ? `<span class="diff-pill pill-eagle">Eagle ×${counts.eagle}</span>` : ''}
    ${counts.birdie ? `<span class="diff-pill pill-birdie">Birdie ×${counts.birdie}</span>` : ''}
    ${counts.par ? `<span class="diff-pill pill-par">Par ×${counts.par}</span>` : ''}
    ${counts.bogey ? `<span class="diff-pill pill-bogey">Bogey ×${counts.bogey}</span>` : ''}
    ${counts.double ? `<span class="diff-pill pill-double">Double+ ×${counts.double}</span>` : ''}
    ${counts.triple ? `<span class="diff-pill pill-double">Triple+ ×${counts.triple}</span>` : ''}`;
}

function updateStats() {
  if (!selectedCourse) return;
  // Met à jour les insights d'analyse en temps réel
  try { updateAnalysis(); } catch(e) {}
  try { updateTotals(); } catch(e) {}
}

function updateAnalysis() {
  const firHit = Object.values(firState).filter(v=>v==='hit').length;
  const firTotal = selectedCourse.trous.filter(h=>h.par!==3).length;
  const girHit = Object.values(girState).filter(v=>v==='hit').length;
  const puttsTotal = putts.reduce((a,p)=>p!==null?a+p:a, 0);
  const scoreTotal = scores.reduce((a,s)=>s!==null?a+s:a, 0);
  const par = selectedCourse.par_total;
  const diff = ((scoreTotal - selectedCourse.rating) * 113 / selectedCourse.slope);

  const bogeys = scores.filter((s,i)=>s!==null&&s-selectedCourse.trous[i].par===1).length;
  const doubles = scores.filter((s,i)=>s!==null&&s-selectedCourse.trous[i].par>=2).length;

  const cont = document.getElementById('analysis-content');
  if (!cont) return;
  cont.innerHTML = `
    <div class="insight-block">
      <div class="insight-title">Score global</div>
      <div class="insight-body">Score de <strong>${scoreTotal}</strong> (${scoreTotal>par?'+':''}${scoreTotal-par}) · Différentiel <strong>${diff.toFixed(1)}</strong>.
      ${diff < parseFloat(document.getElementById('f-hcp').value) ? 'Partie <strong>sous votre handicap</strong> — score comptable favorable.' : 'Partie au-dessus de votre indice habituel.'}</div>
    </div>
    <div class="insight-block">
      <div class="insight-title">Distribution des scores</div>
      <div class="insight-body"><strong>${bogeys} bogeys</strong> et <strong>${doubles} doubles+</strong> sur ce tour. ${doubles >= 3 ? 'Les grandes erreurs coûtent <strong>~'+Math.round(doubles*1.3)+' coups</strong> au total.' : doubles <= 1 ? 'Excellente gestion des erreurs critiques.' : 'Contrôle correct des grandes erreurs.'}</div>
    </div>
    <div class="insight-block">
      <div class="insight-title">GIR & Approches</div>
      <div class="insight-body">GIR à <strong>${girHit}/18 (${Math.round(girHit/18*100)}%)</strong>. ${girHit >= 9 ? 'Niveau d\'approche au-dessus de votre handicap.' : girHit >= 6 ? 'Marge de progression sur les fers.' : '<strong>Axe prioritaire</strong> — chaque GIR supplémentaire vaut ~0.7 coup.'}</div>
    </div>
    <div class="insight-block">
      <div class="insight-title">Précision tee & Fairways</div>
      <div class="insight-body">FIR à <strong>${firHit}/${firTotal} (${Math.round(firHit/firTotal*100)}%)</strong>. ${firHit/firTotal >= .6 ? 'Bonne précision en jeu — driver sous contrôle.' : firHit/firTotal >= .4 ? 'Précision acceptable — optimisable par choix de club.' : '<strong>Priorité driver</strong> — FIR faible amplifie toutes les erreurs suivantes.'}</div>
    </div>
    ${puttsTotal > 0 ? `<div class="insight-block">
      <div class="insight-title">Putting</div>
      <div class="insight-body">Total <strong>${puttsTotal} putts</strong> sur ce tour. ${puttsTotal <= 30 ? 'Putting excellent — atout majeur de ce tour.' : puttsTotal <= 34 ? 'Niveau standard — stable.' : '<strong>Putting coûteux</strong> : '+(puttsTotal-32)+' putts de trop vs référence hcp 14.'}</div>
    </div>` : ''}
    <div class="insight-block">
      <div class="insight-title">Contexte parcours</div>
      <div class="insight-body">Slope <strong>${selectedCourse.slope}</strong> — ${selectedCourse.slope >= 135 ? 'parcours difficile · score à relativiser positivement.' : selectedCourse.slope >= 125 ? 'difficulté standard.' : 'parcours accessible · exigence élevée sur la performance.'} Rating <strong>${selectedCourse.rating}</strong>.</div>
    </div>`;
}

function saveRound() {
  // Si mode Pro : calculer les scores à partir des shots
  if (sc_proMode) {
    Object.keys(sc_shotsByHole).forEach(function(holeKey) {
      var hNum = parseInt(holeKey);
      var shots = sc_shotsByHole[hNum] || [];
      var putts = sc_holePutts[hNum];
      if (shots.length > 0 && sc_holeOnGreen[hNum] !== undefined && putts !== null && putts !== undefined) {
        scores[hNum - 1] = shots.length + putts;
      }
    });
    // FIR/GIR depuis sc_holeFairway et sc_shotsByHole
    if (selectedCourse) {
      selectedCourse.trous.forEach(function(h) {
        if (h.par !== 3 && sc_holeFairway[h.num] === 'yes') firState[h.num] = 'hit';
        else if (h.par !== 3 && sc_holeFairway[h.num] === 'no') firState[h.num] = 'miss';
        // GIR : sur le green en par-2 coups ou moins
        var shotsForHole = sc_shotsByHole[h.num] || [];
        var onGreenAt = sc_holeOnGreen[h.num];
        if (onGreenAt !== undefined && (onGreenAt + 1) <= (h.par - 2)) {
          girState[h.num] = 'hit';
        } else if (onGreenAt !== undefined) {
          girState[h.num] = 'miss';
        }
      });
    }
    // Putts total
    var totalPutts = 0;
    Object.keys(sc_holePutts).forEach(function(k) { totalPutts += sc_holePutts[k] || 0; });
    putts = new Array(18).fill(null);
    selectedCourse.trous.forEach(function(h, i) {
      if (sc_holePutts[h.num] !== undefined) putts[i] = sc_holePutts[h.num];
    });
  }

  const filledScores = scores.filter(s=>s!==null).length;
  if (filledScores < 9) { showToast('Saisissez au moins 9 trous avant d\'enregistrer.'); return; }

  const scoreTotal = scores.reduce((a,s)=>s!==null?a+s:a, 0);
  const par = selectedCourse.par_total;
  const diff = ((scoreTotal - selectedCourse.rating) * 113 / selectedCourse.slope).toFixed(1);
  const firHit = Object.values(firState).filter(v=>v==='hit').length;
  const girHit = Object.values(girState).filter(v=>v==='hit').length;
  const puttsTotal = putts.reduce((a,p)=>p!==null?a+p:a, 0);

  const entry = {
    id: Date.now(),
    date: document.getElementById('f-date').value,
    course: selectedCourse.name,
    courseId: selectedCourse.id,
    score: scoreTotal,
    par: par,
    diff: parseFloat(diff),
    fir: firHit,
    firTotal: selectedCourse.trous.filter(h=>h.par!==3).length,
    gir: girHit,
    putts: puttsTotal || null,
    cond: document.getElementById('f-cond').value,
    format: document.getElementById('f-format').value,
    hcp: parseFloat(document.getElementById('f-hcp').value),
    notes: document.getElementById('f-notes').value,
    scores: [...scores],
    sg_tee:  parseFloat((((firHit / (selectedCourse.trous.filter(function(h){return h.par!==3;}).length||14)) - 0.5) * 1.2).toFixed(2)),
    sg_app:  parseFloat((((girHit / 18) - 0.38) * 2.1).toFixed(2)),
    sg_arg:  parseFloat(((girHit / 18) >= 0.5 ? 0.1 : -0.1).toFixed(2)),
    sg_putt: parseFloat((puttsTotal > 0 ? ((32 - puttsTotal) * 0.15) : 0).toFixed(2)),
    // Données détaillées (si saisie détaillée activée)
    detailMode: sc_detailMode,
    proMode: sc_proMode,
    shots: JSON.parse(JSON.stringify(sc_shotsByHole)),
    shotsOnGreen: JSON.parse(JSON.stringify(sc_holeOnGreen)),
    shotsPutts: JSON.parse(JSON.stringify(sc_holePutts)),
    shotsFairway: JSON.parse(JSON.stringify(sc_holeFairway)),
    clubs: [],
    fairwayPos: [],
    distRemain: [],
    clubsApp: [],
    distFromTarget2: []
  };

  // Remplir les tableaux détaillés
  for (var h = 1; h <= 18; h++) {
    var d = sc_detailData[h] || {};
    entry.clubs.push(d.club || null);
    entry.fairwayPos.push(d.fairwayPos || null);
    entry.distRemain.push(d.distRemain ? parseInt(d.distRemain) : null);
    entry.clubsApp.push(d.clubApp || null);
    entry.distFromTarget2.push(d.distFromTarget2 ? parseInt(d.distFromTarget2) : null);
  }

  roundHistory.unshift(entry);
  if (roundHistory.length > 50) roundHistory.pop();
  // Save to shared key so dashboard can read it
  lsSet('rounds', roundHistory);

  var statusEl = document.getElementById('save-status');
  if (statusEl) statusEl.textContent = 'Partie enregistrée — ' + entry.date;
  var histSec = document.getElementById('roundHistory-section');
  if (histSec) histSec.style.display = 'flex';
  renderHistory();
  clearDraftShots();
  showToast('Partie enregistrée ✓  ' + entry.date + ' · ' + entry.course + ' · ' + scoreTotal + ' (+'+(scoreTotal-par)+')');
  // Rediriger vers le dashboard et rebuild
  setTimeout(function() {
    try {
      // Mettre à jour le hcp affiché en nav
      if (typeof updateNavUI === 'function') updateNavUI();
      var dashPage = document.getElementById('page-dashboard');
      if (dashPage && typeof buildDashboard === 'function') {
        while (dashPage.firstChild) dashPage.removeChild(dashPage.firstChild);
        buildDashboard(dashPage);
      }
      showPage('dashboard');
    } catch(ex) { console.warn('save redirect:', ex.message); }
  }, 800);
}

function renderHistory() {
  if (!roundHistory.length) return;
  var section = document.getElementById('roundHistory-section');
  if (section) section.style.display = 'flex';
  var titleEl = document.getElementById('hist-title');
  if (titleEl) titleEl.style.display = 'block';
  // L'ID peut être 'roundHistory-list' ou 'history-list' selon les versions
  var cont = document.getElementById('roundHistory-list') || document.getElementById('history-list');
  if (!cont) return;
  cont.innerHTML = roundHistory.slice(0,5).map(e => {
    const vsPar = e.score - e.par;
    const col = vsPar < 0 ? 'var(--ok2)' : vsPar <= 7 ? 'var(--wn2)' : 'var(--ng2)';
    return `<div class="roundHistory-row">
      <div class="hr-date">${e.date}</div>
      <div class="hr-course" style="font-size:10px">${e.course}</div>
      <div class="hr-score" style="color:${col}">${e.score}</div>
      <div class="hr-diff" style="color:${vsPar>=0?'var(--wn2)':'var(--ok2)'}">${vsPar>=0?'+':''}${vsPar}</div>
    </div>`;
  }).join('');
}

var _analysePeriod = 10;  // 5, 10, 20, ou 'all'
var _analyseSubtab = 'overview';  // overview, precision, putting, evolution

function initAnalysePage() {
  var pg = document.getElementById('page-analyse');
  if (!pg) return;

  pg.innerHTML = '';

  var wrap = document.createElement('div');
  wrap.className = 'an-wrap';

  /* ── Header avec titre + sélecteur période ── */
  var header = document.createElement('div');
  header.className = 'an-header';
  header.innerHTML = ''
    + '<div class="an-title-block">'
    +   '<div class="an-title">Analyse de performance</div>'
    +   '<div class="an-subtitle" id="an-period-label">Sur les 10 dernières parties</div>'
    + '</div>'
    + '<div class="an-period-selector">'
    +   '<button class="an-period-btn" data-period="5">5</button>'
    +   '<button class="an-period-btn active" data-period="10">10</button>'
    +   '<button class="an-period-btn" data-period="20">20</button>'
    +   '<button class="an-period-btn" data-period="all">Toutes</button>'
    + '</div>';
  wrap.appendChild(header);

  /* ── Sous-onglets ── */
  var subtabs = document.createElement('div');
  subtabs.className = 'an-subtabs';
  var subtabsConfig = [
    { id: 'overview',  label: 'Vue d\'ensemble', icon: '\u25C7' },
    { id: 'precision', label: 'Précision',       icon: '\u25CE' },
    { id: 'putting',   label: 'Putting',         icon: '\u25C9' },
    { id: 'evolution', label: 'Évolution',       icon: '\u25B2' }
  ];
  subtabsConfig.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'an-subtab' + (t.id === 'overview' ? ' active' : '');
    btn.setAttribute('data-subtab', t.id);
    btn.innerHTML = '<span class="an-subtab-icon">' + t.icon + '</span>' + t.label;
    btn.addEventListener('click', function() {
      switchAnalyseSubtab(t.id);
    });
    subtabs.appendChild(btn);
  });
  wrap.appendChild(subtabs);

  /* ── Conteneurs de sous-pages ── */
  ['overview','precision','putting','evolution'].forEach(function(id) {
    var sub = document.createElement('div');
    sub.className = 'an-subpage' + (id === 'overview' ? ' active' : '');
    sub.id = 'an-sub-' + id;
    wrap.appendChild(sub);
  });

  pg.appendChild(wrap);

  /* ── Listeners période ── */
  var periodBtns = pg.querySelectorAll('.an-period-btn');
  periodBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      periodBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var p = btn.getAttribute('data-period');
      _analysePeriod = p === 'all' ? 'all' : parseInt(p);
      updatePeriodLabel();
      renderCurrentAnalyseSubtab();
    });
  });

  /* ── Rendre le sous-onglet par défaut ── */
  renderCurrentAnalyseSubtab();
}

function updatePeriodLabel() {
  var lbl = document.getElementById('an-period-label');
  if (!lbl) return;
  if (_analysePeriod === 'all') {
    lbl.textContent = 'Sur toutes les parties enregistrées';
  } else {
    lbl.textContent = 'Sur les ' + _analysePeriod + ' dernières parties';
  }
}

function switchAnalyseSubtab(id) {
  _analyseSubtab = id;
  // Tabs
  document.querySelectorAll('.an-subtab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-subtab') === id);
  });
  // Pages
  document.querySelectorAll('.an-subpage').forEach(function(p) {
    p.classList.toggle('active', p.id === 'an-sub-' + id);
  });
  renderCurrentAnalyseSubtab();
}

function renderCurrentAnalyseSubtab() {
  if (_analyseSubtab === 'overview')  renderOverview();
  else if (_analyseSubtab === 'precision') renderPrecision();
  else if (_analyseSubtab === 'putting')   renderPutting();
  else if (_analyseSubtab === 'evolution') renderEvolution();
}

function getAnalyseRounds() {
  var rounds = lsGet('rounds') || [];
  if (!rounds.length) return [];
  if (_analysePeriod === 'all') return rounds.slice();
  return rounds.slice(0, _analysePeriod);
}

/* ────────────────────────────────────────
   SOUS-ONGLET 1 : VUE D'ENSEMBLE
──────────────────────────────────────── */
function renderOverview() {
  var page = document.getElementById('an-sub-overview');
  if (!page) return;
  page.innerHTML = '';

  var rounds = getAnalyseRounds();

  if (rounds.length === 0) {
    page.appendChild(makeEmptyCard('overview'));
    return;
  }

  // ── Calculs ──
  var avgScore = (rounds.reduce(function(a,r) { return a + r.score; }, 0) / rounds.length).toFixed(1);
  var avgDiff  = (rounds.reduce(function(a,r) { return a + (r.diff||0); }, 0) / rounds.length).toFixed(1);
  var avgGir   = Math.round(rounds.reduce(function(a,r) { return a + r.gir; }, 0) / rounds.length / 18 * 100);
  var avgFir   = Math.round(rounds.reduce(function(a,r) { var t = r.firTotal||14; return a + r.fir/t; }, 0) / rounds.length * 100);
  var sgTee    = (rounds.reduce(function(a,r) { return a + (r.sg_tee||0); }, 0) / rounds.length).toFixed(2);
  var sgApp    = (rounds.reduce(function(a,r) { return a + (r.sg_app||0); }, 0) / rounds.length).toFixed(2);
  var sgArg    = (rounds.reduce(function(a,r) { return a + (r.sg_arg||0); }, 0) / rounds.length).toFixed(2);
  var sgPutt   = (rounds.reduce(function(a,r) { return a + (r.sg_putt||0); }, 0) / rounds.length).toFixed(2);
  var sgTotal  = (parseFloat(sgTee) + parseFloat(sgApp) + parseFloat(sgArg) + parseFloat(sgPutt)).toFixed(2);

  // ── Carte synthèse ──
  var synth = document.createElement('div');
  synth.className = 'an-card';
  synth.innerHTML = ''
    + '<div class="an-card-header">'
    +   '<div class="an-card-title">Synthèse · ' + rounds.length + ' partie' + (rounds.length>1?'s':'') + '</div>'
    +   '<div class="an-card-sub">Score moyen ' + avgScore + ' · Diff. moyen ' + avgDiff + '</div>'
    + '</div>'
    + '<div class="an-card-body">'
    +   '<div class="an-g3">'
    +     '<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:var(--tx);letter-spacing:-1px">' + avgScore + '</div><div style="font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px">Score moyen</div></div>'
    +     '<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:var(--ok2);letter-spacing:-1px">' + avgGir + '%</div><div style="font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px">GIR moyen</div></div>'
    +     '<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:var(--gold-d);letter-spacing:-1px">' + avgFir + '%</div><div style="font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px">FIR moyen</div></div>'
    +   '</div>'
    + '</div>';
  page.appendChild(synth);

  // ── Strokes Gained détaillés ──
  var sgCard = document.createElement('div');
  sgCard.className = 'an-card';

  var sgBilan, sgBilanColor;
  if (sgTotal >= 0.5) { sgBilan = 'Tu joues globalement mieux que ton niveau ✓'; sgBilanColor = 'var(--ok2)'; }
  else if (sgTotal >= -0.5) { sgBilan = 'Tu joues globalement à ton niveau'; sgBilanColor = 'var(--gold-d)'; }
  else { sgBilan = 'Tu joues sous ton niveau — du potentiel à débloquer'; sgBilanColor = 'var(--ng2)'; }

  var sgRows = [
    { lbl: 'Drive', val: parseFloat(sgTee), desc: 'Driver & bois' },
    { lbl: 'Approche', val: parseFloat(sgApp), desc: 'Fers depuis le fairway' },
    { lbl: 'Jeu court', val: parseFloat(sgArg), desc: 'Chip, pitch, sortie de bunker' },
    { lbl: 'Putting', val: parseFloat(sgPutt), desc: 'Sur le green' }
  ];

  var sgRowsHtml = sgRows.map(function(r) {
    var color = r.val > 0.1 ? 'var(--ok2)' : (r.val < -0.1 ? 'var(--ng2)' : 'var(--tx3)');
    var sign = r.val >= 0 ? '+' : '';
    var pct = Math.min(100, Math.abs(r.val) * 50);
    return ''
      + '<div class="an-stat-row">'
      +   '<div class="an-stat-label">' + r.lbl + '<div style="font-size:9px;font-weight:500;color:var(--tx3);margin-top:2px">' + r.desc + '</div></div>'
      +   '<div class="an-stat-bar-wrap">'

    page.appendChild(unlock);

/* ────────────────────────────────────────
   Heatmap Stableford
──────────────────────────────────────── */
function renderHeatmap(rounds) {
  var card = document.createElement('div');
  card.className = 'an-card';

  // Construire la matrice : pour chaque (partie, trou) → score relatif au par
  // Si pas de données détaillées scores[], afficher juste les moyennes par trou
  var heatmapCells = '';

  // Calculer le score moyen par trou
  var avgByHole = new Array(18).fill(null);
  var courseRef = null;
  rounds.forEach(function(r) {
    if (r.scores && r.scores.length === 18) {
      r.scores.forEach(function(s, i) {
        if (s !== null) {
          if (avgByHole[i] === null) avgByHole[i] = { sum: 0, count: 0 };
          avgByHole[i].sum += s;
          avgByHole[i].count += 1;
        }
      });
    }
    // Récupérer le par du parcours le plus récent
    if (!courseRef) {
      var crs = (typeof COURSES !== 'undefined') ? COURSES.find(function(c) { return c.id === r.courseId; }) : null;
      if (crs) courseRef = crs;
    }
  });

  // Header
  heatmapCells += '<div class="an-heat-label"></div>';
  for (var i = 1; i <= 18; i++) {
    heatmapCells += '<div class="an-heat-header">' + i + '</div>';
  }

  // Ligne PAR
  heatmapCells += '<div class="an-heat-label">Par</div>';
  for (var j = 0; j < 18; j++) {
    var p = courseRef && courseRef.trous && courseRef.trous[j] ? courseRef.trous[j].par : '-';
    heatmapCells += '<div class="an-heat-cell" style="background:var(--bg2);color:var(--tx2)">' + p + '</div>';
  }

  // Ligne MOY
  heatmapCells += '<div class="an-heat-label">Moy</div>';
  for (var k = 0; k < 18; k++) {
    var avg = avgByHole[k];
    if (!avg || !courseRef) {
      heatmapCells += '<div class="an-heat-cell h-empty">-</div>';
      continue;
    }
    var avgScore = avg.sum / avg.count;
    var par = courseRef.trous[k] ? courseRef.trous[k].par : 4;
    var rel = avgScore - par;
    var cls = 'h-par';
    if (rel <= -1.5) cls = 'h-eagle';
    else if (rel <= -0.5) cls = 'h-birdie';
    else if (rel < 0.5) cls = 'h-par';
    else if (rel < 1.5) cls = 'h-bogey';
    else cls = 'h-double';
    heatmapCells += '<div class="an-heat-cell ' + cls + '" title="Trou ' + (k+1) + ' · Moyenne ' + avgScore.toFixed(1) + ' (par ' + par + ')">' + avgScore.toFixed(1) + '</div>';
  }

  card.innerHTML = ''
    + '<div class="an-card-header">'
    +   '<div class="an-card-title">Carte de chaleur par trou <span class="info-tip" title="Visualise tes performances trou par trou. Vert = sous le par (birdie/eagle). Or pâle = au par. Orange/rouge = au-dessus du par. Te montre où tu marques et où tu perds.">?</span></div>'
    +   '<div class="an-card-sub">Score moyen vs par par trou</div>'
    + '</div>'
    + '<div class="an-card-body">'
    +   '<div class="an-heatmap">' + heatmapCells + '</div>'
    +   '<div style="display:flex;gap:14px;margin-top:14px;font-size:10px;color:var(--tx3);font-weight:500;flex-wrap:wrap">'
    +     '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(45,125,58,0.25);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Birdie+</span>'
    +     '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(168,133,30,0.10);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Par</span>'
    +     '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(196,94,10,0.18);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Bogey</span>'
    +     '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(192,57,43,0.22);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Double+</span>'
    +   '</div>'
    + '</div>';
  return card;
}

/* ────────────────────────────────────────
   Recommandations actionnables (format 2 - détaillé pédagogique)
──────────────────────────────────────── */
function renderRecommendations(rounds, sgRows) {
  var card = document.createElement('div');
  card.className = 'an-card';

  // Trier sgRows : pire en premier
  var sorted = sgRows.slice().sort(function(a, b) { return a.val - b.val; });

  // Calculs supplémentaires pour les recommandations
  var avgGir = Math.round(rounds.reduce(function(a,r) { return a + r.gir; }, 0) / rounds.length / 18 * 100);
  var avgFir = Math.round(rounds.reduce(function(a,r) { var t = r.firTotal||14; return a + r.fir/t; }, 0) / rounds.length * 100);
  var avgPutts = rounds.filter(function(r) { return r.putts; }).reduce(function(a,r) { return a + r.putts; }, 0) / Math.max(1, rounds.filter(function(r) { return r.putts; }).length);

  var recos = [];

  // Priorité 1 : pire SG
  var worst = sorted[0];
  if (worst.val < -0.2) {
    var data1 = '', action1 = '';
    if (worst.lbl === 'Drive') {
      data1 = 'Ton FIR moyen est de <strong>' + avgFir + '%</strong> sur ' + rounds.length + ' parties. Tu perds en moyenne <strong>' + worst.val.toFixed(2) + ' coups/tour</strong> au départ par rapport à un joueur de ton niveau.';
      action1 = '<strong>Recommandation :</strong> Travaille la régularité du driver au practice. 30 min, 2x par semaine, avec un objectif de précision plutôt que de distance. Considère utiliser un bois 3 sur les trous étroits.';
    } else if (worst.lbl === 'Approche') {
      data1 = 'Ton GIR moyen est de <strong>' + avgGir + '%</strong> sur ' + rounds.length + ' parties. Les approches au green te coûtent <strong>' + Math.abs(worst.val).toFixed(2) + ' coups/tour</strong>.';
      action1 = '<strong>Recommandation :</strong> Focus sur les fers du milieu (6-7-8). Travaille au practice la distance par club. Objectif : connaître précisément ta distance moyenne pour chaque fer.';
    } else if (worst.lbl === 'Jeu court') {
      data1 = 'Ton jeu court (chip, wedge, bunker) te coûte <strong>' + Math.abs(worst.val).toFixed(2) + ' coups/tour</strong>. C\'est ta plus grosse marge de progression.';
      action1 = '<strong>Recommandation :</strong> 70% du practice devrait être consacré au jeu court d\'ici les prochaines parties. Focus sur les sorties de bunker et les chips de 5-20m. C\'est le plus rentable pour faire baisser ton score.';
    } else {
      data1 = 'Tu utilises en moyenne <strong>' + avgPutts.toFixed(1) + ' putts/tour</strong>. Les putts te coûtent <strong>' + Math.abs(worst.val).toFixed(2) + ' coups/tour</strong>.';
      action1 = '<strong>Recommandation :</strong> Travaille les putts de 1 à 3m. Drill : 10 putts d\'affilée à 1m, puis à 2m, puis à 3m. Objectif : convertir 90% des putts courts.';
    }
    recos.push({ priority: 'urgent', title: 'PRIORITÉ N°1 — Travailler en priorité : ' + worst.lbl, data: data1, action: action1 });
  }

  // Priorité 2 : deuxième pire si différent
  if (sorted[1] && sorted[1].val < -0.1) {
    var second = sorted[1];
    var data2 = 'Tu perds <strong>' + Math.abs(second.val).toFixed(2) + ' coups/tour</strong> sur la catégorie ' + second.lbl + '. C\'est ta deuxième priorité.';
    var action2 = '<strong>Recommandation :</strong> Une fois ' + worst.lbl + ' amélioré, focus sur ce point. Idéalement, 1 séance practice par semaine dédiée à ' + second.lbl + '.';
    recos.push({ priority: 'normal', title: 'PRIORITÉ N°2 — ' + second.lbl, data: data2, action: action2 });
  }

  // Point fort à conserver
  var best = sorted[sorted.length - 1];
  if (best.val > 0.1) {
    var data3 = 'Tu es <strong>+' + best.val.toFixed(2) + ' coups/tour</strong> sur ' + best.lbl + '. C\'est ton point fort.';
    var action3 = '<strong>Garde ce niveau :</strong> Continue de pratiquer cette catégorie 1x par semaine pour maintenir ton avantage. Ne sacrifie pas ton point fort pour travailler tes faiblesses.';
    recos.push({ priority: 'positive', title: 'POINT FORT — ' + best.lbl, data: data3, action: action3 });
  }

  if (recos.length === 0) {
    recos.push({
      priority: 'positive',
      title: 'Performance équilibrée',
      data: 'Tu n\'as pas de point faible majeur identifié sur les ' + rounds.length + ' dernières parties. Ton jeu est globalement équilibré.',
      action: '<strong>Continue ainsi :</strong> Maintiens un entraînement régulier sur tous les compartiments du jeu pour préserver cet équilibre.'
    });
  }

  var recosHtml = recos.map(function(r) {
    return ''
      + '<div class="an-reco ' + r.priority + '" style="margin-bottom:10px">'
      +   '<div class="an-reco-priority">' + r.title.split(' — ')[0] + '</div>'
      +   '<div class="an-reco-content">'
      +     '<div class="an-reco-title">' + (r.title.split(' — ')[1] || r.title) + '</div>'
      +     '<div class="an-reco-data">' + r.data + '</div>'
      +     '<div class="an-reco-action">' + r.action + '</div>'
      +   '</div>'
      + '</div>';
  }).join('');

  card.innerHTML = ''
    + '<div class="an-card-header">'
    +   '<div class="an-card-title">Tes priorités de travail</div>'
    +   '<div class="an-card-sub">Recommandations basées sur tes données</div>'
    + '</div>'
    + '<div class="an-card-body" style="padding:14px 18px">'
    +   recosHtml
    + '</div>';
  return card;
}

/* ────────────────────────────────────────
   SOUS-ONGLET 2 : PRÉCISION
──────────────────────────────────────── */
function renderPrecision() {
  var page = document.getElementById('an-sub-precision');
  if (!page) return;
  page.innerHTML = '';

  var rounds = getAnalyseRounds();
  if (rounds.length === 0) { page.appendChild(makeEmptyCard('precision')); return; }

  // ── Dispersion drive (gauche/centre/droite) ──
  // Si données détaillées : utiliser fairwayPos, sinon estimer depuis FIR
  var dispCard = document.createElement('div');
  dispCard.className = 'an-card';

  var firTotal = 0, firHit = 0, leftMiss = 0, rightMiss = 0, otherMiss = 0;
  var hasDetail = false;
  rounds.forEach(function(r) {
    if (r.fairwayPos && Array.isArray(r.fairwayPos)) {
      hasDetail = true;
      r.fairwayPos.forEach(function(pos) {
        if (!pos) return;
        firTotal++;
        if (pos === 'fairway') firHit++;
        else if (pos === 'rough-l' || pos === 'bunker-l') leftMiss++;
        else if (pos === 'rough-r' || pos === 'bunker-r') rightMiss++;
        else otherMiss++;
      });
    } else {
      firTotal += (r.firTotal || 14);
      firHit += r.fir;
    }
  });

  if (!hasDetail) {
    // Estimation : répartir les misses équitablement
    var misses = firTotal - firHit;
    leftMiss = Math.floor(misses / 2);
    rightMiss = misses - leftMiss;
  }

  var leftPct = firTotal > 0 ? Math.round(leftMiss / firTotal * 100) : 0;
  var centerPct = firTotal > 0 ? Math.round(firHit / firTotal * 100) : 0;
  var rightPct = firTotal > 0 ? Math.round(rightMiss / firTotal * 100) : 0;

  dispCard.innerHTML = ''
    + '<div class="an-card-header">'
    +   '<div class="an-card-title">Dispersion au départ <span class="info-tip" title="Où finit ta balle après le drive. Plus la zone centrale est grande, plus tu es précis. Une forte tendance vers la gauche ou la droite signale un défaut de swing à corriger.">?</span></div>'
    +   '<div class="an-card-sub">' + firTotal + ' départs analysés' + (hasDetail ? '' : ' · données estimées') + '</div>'
    + '</div>'
    + '<div class="an-card-body">'
    +   '<div class="an-dispersion">'
    +     '<div class="an-disp-zone"><div class="an-disp-value">' + leftPct + '%</div><div class="an-disp-label">Gauche</div></div>'
    +     '<div class="an-disp-zone center"><div class="an-disp-value">' + centerPct + '%</div><div class="an-disp-label">Fairway</div></div>'
    +     '<div class="an-disp-zone"><div class="an-disp-value">' + rightPct + '%</div><div class="an-disp-label">Droite</div></div>'
    +   '</div>'
    +   (hasDetail ? '' : '<div style="margin-top:12px;padding:10px 14px;background:var(--gold-dim2);border-radius:8px;font-size:11px;color:var(--tx2);line-height:1.5"><strong style="color:var(--gold-d)">Astuce :</strong> Active la <strong>saisie détaillée</strong> dans la Scorecard pour avoir la vraie dispersion (gauche/centre/droite) au lieu d\'une estimation.</div>')
    + '</div>';
  page.appendChild(dispCard);

  // ── Précision GIR par catégorie de par ──
  var girCard = document.createElement('div');
  girCard.className = 'an-card';

  var girPar3 = { hit: 0, total: 0 }, girPar4 = { hit: 0, total: 0 }, girPar5 = { hit: 0, total: 0 };
  rounds.forEach(function(r) {
    var crs = (typeof COURSES !== 'undefined') ? COURSES.find(function(c) { return c.id === r.courseId; }) : null;
    if (!crs || !crs.trous) return;
    if (r.scores && r.scores.length === 18) {
      r.scores.forEach(function(s, i) {
        if (s === null) return;
        var par = crs.trous[i] ? crs.trous[i].par : 4;
        var hit = (s - par) <= 0;  // approximation : score <= par signifie probablement GIR
        if (par === 3) { girPar3.total++; if (hit) girPar3.hit++; }
        else if (par === 4) { girPar4.total++; if (hit) girPar4.hit++; }
        else if (par === 5) { girPar5.total++; if (hit) girPar5.hit++; }
      });
    }
  });

  function pctRow(name, obj, color) {
    var pct = obj.total > 0 ? Math.round(obj.hit / obj.total * 100) : 0;
    return ''
      + '<div class="an-stat-row">'
      +   '<div class="an-stat-label">' + name + '</div>'
      +   '<div class="an-stat-bar-wrap">'
      +     '<div class="an-stat-bar-track"><div class="an-stat-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>'
      +   '</div>'
      +   '<div class="an-stat-value">' + pct + '%</div>'
      +   '<div class="an-stat-trend" style="color:var(--tx3)">' + obj.hit + '/' + obj.total + '</div>'
      + '</div>';
  }

  girCard.innerHTML = ''
    + '<div class="an-card-header">'
    +   '<div class="an-card-title">Greens par type de trou <span class="info-tip" title="Approximation basée sur le score. Si tu fais le par ou mieux, on considère que tu as touché le green en régulation. Pour la vraie donnée GIR, active la saisie détaillée.">?</span></div>'
    +   '<div class="an-card-sub">Pourcentage de greens atteints en régulation</div>'
    + '</div>'
    + '<div class="an-card-body">'
    +   pctRow('Par 3', girPar3, 'var(--ok2)')
    +   pctRow('Par 4', girPar4, 'var(--gold)')
    +   pctRow('Par 5', girPar5, 'var(--ng2)')
    + '</div>';
  page.appendChild(girCard);

  // Encart "Active saisie détaillée"
  if (!hasDetail) {
    var unlock = document.createElement('div');
    unlock.className = 'an-unlock-card';
    unlock.innerHTML = ''
      + '<div class="an-unlock-icon">\u25C8</div>'
      + '<div class="an-unlock-text"><strong>Débloque la dispersion club par club</strong> en activant la saisie détaillée dans la Scorecard. Tu pourras voir exactement où va ta balle avec chaque club (driver, fers, wedges).</div>';
    page.appendChild(unlock);
  }
}

/* ════════════════════════════════════════════
   RADAR DE DISPERSION — SESSION 5
════════════════════════════════════════════ */

// État global de la partie en cours (mode pro)
var sc_proMode = false;           // Mode pro activé ?
var sc_shotsByHole = {};          // { holeNum: [shots] }
var sc_holeOnGreen = {};          // { holeNum: indexDuShotOuArriveeAuGreen }
var sc_holePutts = {};            // { holeNum: nombreDePutts }
var sc_holeFairway = {};          // { holeNum: 'yes'|'no'|null } pour FIR
var sc_clubMemory = {};           // { distance: lastClubUsed } pour suggestion

// État du radar courant (en cours d'édition)
var _radarState = null;

/* ──────────────────────────────────
   Liste des clubs disponibles
────────────────────────────────── */
var CLUBS = [
  { val: 'Driver',   name: 'Driver',   range: [180, 280] },
  { val: 'Bois 3',   name: 'Bois 3',   range: [170, 230] },
  { val: 'Bois 5',   name: 'Bois 5',   range: [160, 210] },
  { val: 'Hybride',  name: 'Hybride',  range: [140, 190] },
  { val: 'Fer 3',    name: 'Fer 3',    range: [140, 190] },
  { val: 'Fer 4',    name: 'Fer 4',    range: [130, 175] },
  { val: 'Fer 5',    name: 'Fer 5',    range: [120, 165] },
  { val: 'Fer 6',    name: 'Fer 6',    range: [110, 150] },
  { val: 'Fer 7',    name: 'Fer 7',    range: [100, 140] },
  { val: 'Fer 8',    name: 'Fer 8',    range: [90,  125] },
  { val: 'Fer 9',    name: 'Fer 9',    range: [75,  115] },
  { val: 'PW',       name: 'PW',       range: [60,  100] },
  { val: 'GW',       name: 'GW',       range: [50,  85]  },
  { val: 'SW',       name: 'SW',       range: [30,  70]  },
  { val: 'LW',       name: 'LW',       range: [15,  50]  }
];

function suggestClubForDistance(distance) {
  if (!distance || distance <= 0) return null;
  // 1. Mémoire personnelle d'abord
  var rounds = lsGet('rounds') || [];
  var sameDistanceShots = [];
  rounds.forEach(function(r) {
    if (!r.shots) return;
    Object.keys(r.shots).forEach(function(holeKey) {
      r.shots[holeKey].forEach(function(shot) {
        if (shot.distBefore && Math.abs(shot.distBefore - distance) < 15 && shot.club) {
          sameDistanceShots.push(shot.club);
        }
      });
    });
  });
  if (sameDistanceShots.length >= 2) {
    // Club le plus utilisé
    var counts = {};
    sameDistanceShots.forEach(function(c) { counts[c] = (counts[c]||0) + 1; });
    var best = Object.keys(counts).sort(function(a,b) { return counts[b]-counts[a]; })[0];
    return { club: best, source: 'mémoire (' + sameDistanceShots.length + ' coups passés)' };
  }
  // 2. Sinon, suggestion générique basée sur la distance
  for (var i = 0; i < CLUBS.length; i++) {
    var c = CLUBS[i];
    if (distance >= c.range[0] && distance <= c.range[1]) {
      return { club: c.val, source: 'suggestion standard' };
    }
  }
  // 3. Hors plage
  if (distance > 280) return { club: 'Driver', source: 'distance importante' };
  if (distance < 15)  return { club: 'LW', source: 'distance très courte' };
  return null;
}

/* ──────────────────────────────────
   OUVERTURE DU RADAR
   options : {
     holeNum,         // numéro du trou
     shotIndex,       // index du coup (0 = drive)
     parTrou,         // par du trou
     totalDist,       // distance totale du trou
     prevShot,        // coup précédent (pour distance restante)
     defaultDist,     // distance par défaut au radar
     isApproach,      // true si on vise le green
     onSave           // callback(shot) quand validé
   }
────────────────────────────────── */
function openRadar(options) {
  options = options || {};
  var holeNum     = options.holeNum;
  var shotIndex   = options.shotIndex;
  var parTrou     = options.parTrou || 4;
  var totalDist   = options.totalDist || 0;
  var defaultDist = options.defaultDist || (parTrou === 3 ? totalDist : totalDist - 220);
  if (defaultDist < 20) defaultDist = 50;

  // Suggestion club
  var suggestion = suggestClubForDistance(defaultDist);

  _radarState = {
    distToTarget: null,    // calculé après clic
    direction: null,       // angle en degrés
    side: null,            // 'left' | 'right' | 'long' | 'short' | 'pin'
    ballX: null,           // position % dans le SVG
    ballY: null,
    club: suggestion ? suggestion.club : '',
    distBefore: defaultDist,
    onGreen: false,        // case arrivée au green
    fairwayState: null     // pour le drive uniquement
  };

  // Build modal
  var modal = document.getElementById('radar-modal');
  if (modal) modal.remove();
  modal = document.createElement('div');
  modal.className = 'radar-modal';
  modal.id = 'radar-modal';

  // Construction conditionnelle de l'UI
  var coupLabel = '';
  var isDrive = (shotIndex === 0);
  if (isDrive && parTrou !== 3) {
    coupLabel = 'Coup 1 — Départ';
  } else if (isDrive && parTrou === 3) {
    coupLabel = 'Coup 1 — Départ vers green';
  } else {
    coupLabel = 'Coup ' + (shotIndex + 1) + (options.isApproach ? ' — Approche' : '');
  }

  var clubOptionsHtml = '<option value="">— Choisir un club —</option>'
    + CLUBS.map(function(c) {
        return '<option value="' + c.val + '"' + (c.val === _radarState.club ? ' selected' : '') + '>' + c.name + '</option>';
      }).join('');

  // Fairway toggle (uniquement pour drive sur par 4/5)
  var fairwayHtml = '';
  if (isDrive && parTrou !== 3) {
    fairwayHtml = ''
      + '<div>'
      +   '<div class="radar-field-label">Position après le drive</div>'
      +   '<div class="radar-fairway-toggle">'
      +     '<button type="button" class="radar-fairway-btn yes" data-fairway="yes">✓ Sur le fairway</button>'
      +     '<button type="button" class="radar-fairway-btn no" data-fairway="no">✗ Manqué</button>'
      +   '</div>'
      + '</div>';
  }

  // Toggle "arrivée au green" (sauf si c'est déjà sur le green, ou putt)
  var greenToggleHtml = '';
  if (!options.isPutt) {
    greenToggleHtml = ''
      + '<div class="radar-green-toggle" id="radar-green-toggle">'
      +   '<div class="radar-green-checkbox" id="radar-green-cb"></div>'
      +   '<div>'
      +     '<div class="radar-green-label">Arrivée au green ⛳</div>'
      +     '<div class="radar-green-sub">Coche si ta balle est sur le green après ce coup. Les prochains coups seront des putts.</div>'
      +   '</div>'
      + '</div>';
  }

  modal.innerHTML = ''
    + '<div class="radar-card">'
    +   '<div class="radar-header">'
    +     '<div class="radar-header-left">'
    +       '<div class="radar-trou">Trou ' + holeNum + ' · Par ' + parTrou + ' · ' + totalDist + 'm</div>'
    +       '<div class="radar-coup">' + coupLabel + '</div>'
    +     '</div>'
    +     '<button class="radar-close" id="radar-close-btn">×</button>'
    +   '</div>'
    +   '<div class="radar-body">'
    +     '<div class="radar-fields">'
    +       '<div>'
    +         '<div class="radar-field-label">Club utilisé</div>'
    +         '<select class="radar-field-select" id="radar-club">' + clubOptionsHtml + '</select>'
    +         (suggestion ? '<div class="radar-suggestion">◆ Suggestion : ' + suggestion.club + ' (' + suggestion.source + ')</div>' : '')
    +       '</div>'
    +       '<div>'
    +         '<div class="radar-field-label">Distance au coup (m)</div>'
    +         '<input type="number" class="radar-field-input" id="radar-dist-before" value="' + Math.round(defaultDist) + '" min="0" max="500">'
    +       '</div>'
    +     '</div>'
    +     fairwayHtml
    +     '<div>'
    +       '<div class="radar-field-label" style="margin-bottom:8px">Position de ta balle <span style="color:var(--tx4);font-weight:500;text-transform:none;font-size:10px">(tape sur le radar pour positionner)</span></div>'
    +       '<div class="radar-svg-wrap" id="radar-svg-wrap">'
    +         buildRadarSVG()
    +       '</div>'
    +     '</div>'
    +     '<div class="radar-result" id="radar-result">'
    +       '<div class="radar-empty" style="grid-column:1/3">Tape sur le radar pour positionner ta balle</div>'
    +     '</div>'
    +     greenToggleHtml
    +   '</div>'
    +   '<div class="radar-footer">'
    +     '<button class="radar-btn radar-btn-cancel" id="radar-cancel-btn">Annuler</button>'
    +     '<button class="radar-btn radar-btn-validate" id="radar-validate-btn" disabled>Valider ce coup ✓</button>'
    +   '</div>'
    + '</div>';

  document.body.appendChild(modal);

  // Listeners
  document.getElementById('radar-close-btn').addEventListener('click', closeRadar);
  document.getElementById('radar-cancel-btn').addEventListener('click', closeRadar);
  modal.addEventListener('click', function(ev) {
    if (ev.target === modal) closeRadar();
  });

  // Champs
  document.getElementById('radar-club').addEventListener('change', function() {
    _radarState.club = this.value;
    updateValidateBtn();
  });
  document.getElementById('radar-dist-before').addEventListener('input', function() {
    _radarState.distBefore = parseFloat(this.value) || 0;
  });

  // Fairway toggle
  if (isDrive && parTrou !== 3) {
    var fbtns = modal.querySelectorAll('.radar-fairway-btn');
    fbtns.forEach(function(b) {
      b.addEventListener('click', function() {
        fbtns.forEach(function(x) { x.classList.remove('active'); });
        b.classList.add('active');
        _radarState.fairwayState = b.getAttribute('data-fairway');
        updateValidateBtn();
      });
    });
  }

  // Green toggle
  var greenToggle = document.getElementById('radar-green-toggle');
  if (greenToggle) {
    greenToggle.addEventListener('click', function() {
      _radarState.onGreen = !_radarState.onGreen;
      greenToggle.classList.toggle('checked', _radarState.onGreen);
      var cb = document.getElementById('radar-green-cb');
      if (cb) cb.textContent = _radarState.onGreen ? '✓' : '';
    });
  }

  // Click sur le radar (tap pour positionner la balle)
  var wrap = document.getElementById('radar-svg-wrap');
  var handlePointer = function(ev) {
    ev.preventDefault();
    var rect = wrap.getBoundingClientRect();
    var clientX, clientY;
    if (ev.touches && ev.touches.length) {
      clientX = ev.touches[0].clientX;
      clientY = ev.touches[0].clientY;
    } else {
      clientX = ev.clientX;
      clientY = ev.clientY;
    }
    var x = ((clientX - rect.left) / rect.width) * 100;
    var y = ((clientY - rect.top) / rect.height) * 100;
    // Clip
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    positionBall(x, y);
  };
  wrap.addEventListener('mousedown', handlePointer);
  wrap.addEventListener('touchstart', handlePointer, { passive: false });

  // Validate
  document.getElementById('radar-validate-btn').addEventListener('click', function() {
    if (!_radarState.ballX) return;
    var shot = {
      shotIndex: shotIndex,
      club: _radarState.club,
      distBefore: _radarState.distBefore,
      distToTarget: _radarState.distToTarget,
      side: _radarState.side,
      angle: _radarState.direction,
      ballX: _radarState.ballX,
      ballY: _radarState.ballY,
      onGreen: _radarState.onGreen,
      fairwayState: _radarState.fairwayState,
      timestamp: Date.now()
    };
    closeRadar();
    if (typeof options.onSave === 'function') options.onSave(shot);
  });
}

function closeRadar() {
  var m = document.getElementById('radar-modal');
  if (m) m.remove();
  _radarState = null;
}

/* SVG du radar (cible au centre + anneaux concentriques) */
function buildRadarSVG() {
  // Anneaux : 5m, 10m, 20m, 30m
  // Le centre = cible (drapeau)
  // L'échelle : 30m = bord du radar (50% du SVG = 30m réel)
  var html = '<svg class="radar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">';
  // Croix axes
  html += '<line class="radar-axis" x1="100" y1="0" x2="100" y2="200"/>';
  html += '<line class="radar-axis" x1="0" y1="100" x2="200" y2="100"/>';
  // Anneaux
  // 5m → r=16.67 / 10m → r=33.33 / 20m → r=66.67 / 30m → r=100
  [
    { r: 16.67, label: '5m' },
    { r: 33.33, label: '10m' },
    { r: 66.67, label: '20m' },
    { r: 100,   label: '30m' }
  ].forEach(function(ring) {
    html += '<circle class="radar-ring" cx="100" cy="100" r="' + ring.r + '"/>';
    html += '<text class="radar-ring-label" x="100" y="' + (100 - ring.r - 2) + '" text-anchor="middle">' + ring.label + '</text>';
  });
  // Cible au centre (drapeau emoji)
  html += '<circle class="radar-target-circle" cx="100" cy="100" r="4"/>';
  html += '<text x="100" y="106" text-anchor="middle" font-size="20">⛳</text>';
  // Points cardinaux
  html += '<text class="radar-cardinal" x="100" y="12" text-anchor="middle">LONG</text>';
  html += '<text class="radar-cardinal" x="100" y="195" text-anchor="middle">COURT</text>';
  html += '<text class="radar-cardinal" x="6" y="103" text-anchor="start">G</text>';
  html += '<text class="radar-cardinal" x="194" y="103" text-anchor="end">D</text>';
  // Position de la balle (cachée au démarrage)
  html += '<circle class="radar-ball" id="radar-ball-mark" cx="100" cy="100" r="0"/>';
  html += '</svg>';
  return html;
}

/* Positionne la balle sur le radar et calcule distance/direction */
function positionBall(percentX, percentY) {
  // Position dans le SVG (en %)
  // Convertir en coordonnées SVG (0-200)
  var svgX = (percentX / 100) * 200;
  var svgY = (percentY / 100) * 200;
  // Distance pixel au centre (100,100)
  var dx = svgX - 100;
  var dy = svgY - 100;
  var distPx = Math.sqrt(dx*dx + dy*dy);
  // Conversion px → mètres : r=100 = 30m → 1m = 3.33px
  var distMeters = distPx / (100/30);

  // Angle (0 = haut, 90 = droite, 180 = bas, 270 = gauche)
  var angleRad = Math.atan2(dx, -dy);
  var angleDeg = Math.round((angleRad * 180 / Math.PI + 360) % 360);

  // Détermination côté
  var side;
  if (distMeters < 2) side = 'pin';
  else if (angleDeg >= 315 || angleDeg < 45) side = 'long';
  else if (angleDeg >= 45 && angleDeg < 135) side = 'right';
  else if (angleDeg >= 135 && angleDeg < 225) side = 'short';
  else side = 'left';

  _radarState.ballX = percentX;
  _radarState.ballY = percentY;
  _radarState.distToTarget = Math.round(distMeters * 10) / 10;
  _radarState.direction = angleDeg;
  _radarState.side = side;

  // Mettre à jour la balle sur le SVG
  var ballMark = document.getElementById('radar-ball-mark');
  if (ballMark) {
    ballMark.setAttribute('cx', svgX);
    ballMark.setAttribute('cy', svgY);
    ballMark.setAttribute('r', '6');
  }

  // Mettre à jour les résultats affichés
  var sideLabels = {
    pin: '🎯 Sur la cible !',
    long: '⬆ Long',
    short: '⬇ Court',
    left: '⬅ Gauche',
    right: 'Droite ➡'
  };
  var resultEl = document.getElementById('radar-result');
  if (resultEl) {
    resultEl.innerHTML = ''
      + '<div class="radar-result-item">'
      +   '<div class="radar-result-val">' + _radarState.distToTarget + 'm</div>'
      +   '<div class="radar-result-lbl">de la cible</div>'
      + '</div>'
      + '<div class="radar-result-item">'
      +   '<div class="radar-result-val" style="font-size:14px;padding:6px 0">' + sideLabels[side] + '</div>'
      +   '<div class="radar-result-lbl">direction</div>'
      + '</div>';
  }

  updateValidateBtn();
}

function updateValidateBtn() {
  var btn = document.getElementById('radar-validate-btn');
  if (!btn) return;
  var ok = _radarState && _radarState.ballX !== null && _radarState.club;
  btn.disabled = !ok;
}




/* ════════════════════════════════════════════
   ZONE PRO — Cartes par trou (coup par coup)
════════════════════════════════════════════ */
function buildProShotZone() {
  var zone = document.getElementById('shot-pro-zone');
  if (!zone) return;
  if (!selectedCourse) return;

  zone.innerHTML = '';

  // Banner explicatif
  var banner = document.createElement('div');
  banner.style.cssText = 'background:var(--gold-dim);border:1px solid rgba(201,168,76,0.3);border-radius:12px;padding:12px 16px;font-size:12px;color:var(--tx2);line-height:1.5';
  banner.innerHTML = '<strong style="color:var(--gold-d)">◆ Mode Pro</strong> · Pour chaque trou, enregistre <strong>chaque coup individuellement</strong> en utilisant le radar de dispersion. Tu obtiendras des données ultra-précises pour ton analyse de performance.';
  zone.appendChild(banner);

  // Carte pour chaque trou
  selectedCourse.trous.forEach(function(h) {
    zone.appendChild(buildHoleCard(h));
  });
}

function buildHoleCard(hole) {
  var card = document.createElement('div');
  card.className = 'shot-trou-card';
  card.id = 'hole-card-' + hole.num;

  var shots = sc_shotsByHole[hole.num] || [];
  var putts = sc_holePutts[hole.num];
  var onGreenIdx = sc_holeOnGreen[hole.num];
  var fairwayState = sc_holeFairway[hole.num];

  // Score total : coups jusqu'au green + putts
  var coupsCount = shots.length;
  var totalScore = coupsCount + (putts || 0);
  var hasOnGreen = onGreenIdx !== undefined && onGreenIdx !== null;
  var canAddShots = !hasOnGreen;

  var scoreColor = 'var(--tx)';
  var scoreLabel = '';
  if (totalScore > 0 && hasOnGreen && putts !== null && putts !== undefined) {
    var rel = totalScore - hole.par;
    if (rel <= -2) { scoreColor = 'var(--gold-d)'; scoreLabel = 'EAGLE'; }
    else if (rel === -1) { scoreColor = 'var(--ok2)'; scoreLabel = 'BIRDIE'; }
    else if (rel === 0) { scoreColor = 'var(--tx2)'; scoreLabel = 'PAR'; }
    else if (rel === 1) { scoreColor = 'var(--wn)'; scoreLabel = 'BOGEY'; }
    else if (rel === 2) { scoreColor = 'var(--ng2)'; scoreLabel = 'DOUBLE'; }
    else { scoreColor = 'var(--ng)'; scoreLabel = '+' + rel; }
  }

  // Header
  var headerHtml = ''
    + '<div class="shot-trou-header">'
    +   '<div>'
    +     '<div class="shot-trou-title">Trou ' + hole.num + '</div>'
    +     '<div class="shot-trou-meta">Par <strong>' + hole.par + '</strong> · SI <strong>' + hole.si + '</strong> · <strong>' + hole.longueur + 'm</strong></div>'
    +   '</div>'
    +   (totalScore > 0 ? '<div style="text-align:right">'
    +     '<div class="shot-summary-score" style="color:' + scoreColor + '">' + totalScore + '</div>'
    +     (scoreLabel ? '<div style="font-size:9px;font-weight:700;color:' + scoreColor + ';text-transform:uppercase;letter-spacing:.08em;margin-top:-2px">' + scoreLabel + '</div>' : '')
    +   '</div>' : '')
    + '</div>';

  card.innerHTML = headerHtml + '<div class="shot-trou-body" id="hole-body-' + hole.num + '"></div>';

  var body = card.querySelector('.shot-trou-body');

  // Liste des coups enregistrés
  shots.forEach(function(shot, idx) {
    var entry = document.createElement('div');
    entry.className = 'shot-entry';
    var clubText = shot.club || 'Club non précisé';
    var sideLabel = '';
    if (shot.side === 'pin')   sideLabel = ' 🎯 sur la cible';
    else if (shot.side === 'left')  sideLabel = ' ⬅ gauche';
    else if (shot.side === 'right') sideLabel = ' ➡ droite';
    else if (shot.side === 'long')  sideLabel = ' ⬆ long';
    else if (shot.side === 'short') sideLabel = ' ⬇ court';

    var distStr = (shot.distToTarget !== null && shot.distToTarget !== undefined)
      ? shot.distToTarget + 'm de la cible' : '';

    entry.innerHTML = ''
      + '<div class="shot-entry-num">' + (idx + 1) + '</div>'
      + '<div class="shot-entry-info">'
      +   '<div class="shot-entry-title">' + clubText + (shot.onGreen ? ' ⛳ Arrivée au green' : '') + '</div>'
      +   '<div class="shot-entry-meta">' + (shot.distBefore ? 'Distance ' + shot.distBefore + 'm · ' : '') + distStr + sideLabel + '</div>'
      + '</div>'
      + '<div class="shot-entry-actions">'
      +   '<button class="shot-action-btn delete" data-action="del" data-shot="' + idx + '" title="Supprimer">×</button>'
      + '</div>';
    body.appendChild(entry);

    entry.querySelector('[data-action="del"]').addEventListener('click', function() {
      if (!confirm('Supprimer ce coup ?')) return;
      sc_shotsByHole[hole.num].splice(idx, 1);
      // Si on supprime le coup d'arrivée au green, reset
      if (idx === sc_holeOnGreen[hole.num]) {
        delete sc_holeOnGreen[hole.num];
        delete sc_holePutts[hole.num];
      } else if (sc_holeOnGreen[hole.num] !== undefined && idx < sc_holeOnGreen[hole.num]) {
        sc_holeOnGreen[hole.num]--;
      }
      buildProShotZone();
      saveDraftShots();
    });
  });

  // Si arrivée au green : champ putts
  if (hasOnGreen) {
    var puttsRow = document.createElement('div');
    puttsRow.className = 'shot-putts-row';
    puttsRow.innerHTML = ''
      + '<div class="shot-putts-label">⛳ Sur le green — Nombre de putts ?</div>'
      + '<input type="number" class="shot-putts-input" id="putts-input-' + hole.num + '" min="0" max="10" placeholder="—" value="' + (putts !== null && putts !== undefined ? putts : '') + '">';
    body.appendChild(puttsRow);

    puttsRow.querySelector('input').addEventListener('input', function() {
      var v = parseInt(this.value);
      if (!isNaN(v) && v >= 0) {
        sc_holePutts[hole.num] = v;
      } else {
        sc_holePutts[hole.num] = null;
      }
      saveDraftShots();
      // Rebuild only the header to update score
      var updated = buildHoleCard(hole);
      card.replaceWith(updated);
    });
  }

  // Bouton ajouter un coup (si pas encore arrivé au green)
  if (canAddShots) {
    var addBtn = document.createElement('button');
    addBtn.className = 'shot-add-btn';
    var nextShotNum = shots.length + 1;
    var nextLabel = nextShotNum === 1 ? 'Enregistrer le départ' : 'Enregistrer le coup ' + nextShotNum;
    addBtn.innerHTML = ''
      + '<div class="shot-add-icon">+</div>'
      + '<div>' + nextLabel + '</div>';
    addBtn.addEventListener('click', function() {
      // Calculer la distance restante avant ce coup
      var distBefore = hole.longueur;  // au départ, distance totale
      if (shots.length > 0) {
        var lastShot = shots[shots.length - 1];
        distBefore = lastShot.distToTarget || 100;
      }
      openRadar({
        holeNum: hole.num,
        shotIndex: shots.length,
        parTrou: hole.par,
        totalDist: hole.longueur,
        defaultDist: distBefore,
        isApproach: (shots.length >= hole.par - 2),
        onSave: function(shot) {
          if (!sc_shotsByHole[hole.num]) sc_shotsByHole[hole.num] = [];
          sc_shotsByHole[hole.num].push(shot);
          if (shot.onGreen) {
            sc_holeOnGreen[hole.num] = sc_shotsByHole[hole.num].length - 1;
          }
          if (shot.fairwayState !== null && shot.fairwayState !== undefined) {
            sc_holeFairway[hole.num] = shot.fairwayState;
          }
          buildProShotZone();
          saveDraftShots();
        }
      });
    });
    body.appendChild(addBtn);
  }

  return card;
}

/* Sauvegarde locale temporaire pendant la partie */
function saveDraftShots() {
  try {
    localStorage.setItem('tsg_draft_shots', JSON.stringify({
      shotsByHole: sc_shotsByHole,
      onGreen: sc_holeOnGreen,
      putts: sc_holePutts,
      fairway: sc_holeFairway
    }));
  } catch(e) {}
}

function loadDraftShots() {
  try {
    var raw = localStorage.getItem('tsg_draft_shots');
    if (raw) {
      var d = JSON.parse(raw);
      sc_shotsByHole = d.shotsByHole || {};
      sc_holeOnGreen = d.onGreen || {};
      sc_holePutts = d.putts || {};
      sc_holeFairway = d.fairway || {};
    }
  } catch(e) {}
}

function clearDraftShots() {
  try { localStorage.removeItem('tsg_draft_shots'); } catch(e) {}
  sc_shotsByHole = {};
  sc_holeOnGreen = {};
  sc_holePutts = {};
  sc_holeFairway = {};
}

(function init() {
  // Construire les profils dans le login
  buildProfiles();

  // Auto-login si un utilisateur est mémorisé
  var lastId = lsGet('lastUser');
  if (lastId) {
    var profiles = lsGet('profiles') || DEFAULT_PROFILES;
    for (var i = 0; i < profiles.length; i++) {
      if (profiles[i].id === lastId) {
        currentUser     = profiles[i];
        selectedProfile = profiles[i];
        launchApp();
        return;
      }
    }
  }
  // Sinon afficher le login
})();</script>
