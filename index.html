<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Analyser · Structurer · Performer — Application de performance golf">
  <title>The Smart Golfer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23C9A84C'/%3E%3Ctext x='50' y='68' font-family='Plus Jakarta Sans, sans-serif' font-size='56' font-weight='700' fill='%231A1209' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json?v=23">
  <meta name="theme-color" content="#C9A84C">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Golfer">

  <!-- Plus Jakarta Sans (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>


<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ══════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════ -->
<div id="login-screen">
  <div class="login-brand">The Smart <span>Golfer</span></div>
  <div class="login-tagline">Analyser &nbsp;&middot;&nbsp; Structurer &nbsp;&middot;&nbsp; Performer</div>

  <div class="login-card">
    <!-- ─── AUTH CLOUD (email + mot de passe) ─── -->
    <div id="auth-box">
      <div class="auth-tabs">
        <button class="auth-tab on" id="auth-tab-login" type="button">Se connecter</button>
        <button class="auth-tab" id="auth-tab-signup" type="button">Cr&eacute;er un compte</button>
      </div>

      <div id="auth-error" class="auth-error" style="display:none"></div>

      <div class="form-group auth-signup-only" style="display:none">
        <label class="form-label" for="auth-name">Pr&eacute;nom &amp; Nom</label>
        <input class="form-input" id="auth-name" type="text" placeholder="Ex: Pierre Martin" autocomplete="name">
      </div>
      <div class="form-row auth-signup-only" style="display:none">
        <div class="form-group">
          <label class="form-label" for="auth-hcp">Handicap</label>
          <input class="form-input" id="auth-hcp" type="number" placeholder="14.2" step="0.1" min="0" max="54">
        </div>
        <div class="form-group">
          <label class="form-label" for="auth-role">R&ocirc;le</label>
          <select class="form-select" id="auth-role">
            <option value="player">Joueur</option>
            <option value="head">Head Coach</option>
            <option value="coach">Coach Assistant</option>
            <option value="captain">Capitaine</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="auth-email">Email</label>
        <input class="form-input" id="auth-email" type="email" placeholder="ton@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="auth-password">Mot de passe</label>
        <input class="form-input" id="auth-password" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
      </div>
      <button class="btn-login" id="auth-submit" type="button">Se connecter &rarr;</button>

      <button class="auth-guest-toggle" id="auth-guest-toggle" type="button">Essayer en mode d&eacute;mo (sans compte)</button>
    </div>

    <!-- ─── MODE DÉMO (local, sans compte) ─── -->
    <div id="guest-section" style="display:none">
      <div class="login-divider">Mode d&eacute;mo &mdash; local</div>
      <div class="login-card-sub">Choisissez un profil de d&eacute;mo ou cr&eacute;ez-en un local</div>
      <div id="profiles-list"></div>
      <div class="login-divider">ou cr&eacute;ez votre profil</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="inp-name">Pr&eacute;nom &amp; Nom</label>
          <input class="form-input" id="inp-name" type="text" placeholder="Ex: Pierre Martin" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-hcp">Handicap</label>
          <input class="form-input" id="inp-hcp" type="number" placeholder="14.2" step="0.1" min="0" max="54">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="inp-role">R&ocirc;le</label>
        <select class="form-select" id="inp-role">
          <option value="player">Joueur</option>
          <option value="head">Head Coach</option>
          <option value="coach">Coach Assistant</option>
          <option value="captain">Capitaine</option>
        </select>
      </div>
      <button class="btn-login" id="btn-enter">Entrer en mode d&eacute;mo &rarr;</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     APPLICATION
══════════════════════════════════ -->
<div id="app">

  <nav class="topnav">
    <div class="nav-brand">
      <div class="nav-emblem">&#9672;</div>
      <div class="nav-title">Smart <span>Golfer</span></div>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
    <div class="nav-right">
      <div class="nav-hcp-block">
        <div class="nav-hcp-val" id="nav-hcp">&#8212;</div>
        <div class="nav-hcp-lbl">Hcp</div>
      </div>
      <div class="nav-user" id="nav-user" title="Cliquer pour se d&eacute;connecter">
        <div class="nav-user-av" id="nav-av"></div>
        <div>
          <div class="nav-user-name" id="nav-name">&#8212;</div>
          <div class="nav-role-badge" id="nav-role">&#8212;</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="app-content" id="app-content"></div>

  <!-- Barre de navigation mobile (bas) -->
  <nav class="bottomnav" id="bottomnav"></nav>

  <!-- Feuille "Plus" (menu secondaire mobile) -->
  <div class="nav-sheet" id="nav-sheet">
    <div class="nav-sheet-backdrop" id="nav-sheet-backdrop"></div>
    <div class="nav-sheet-panel">
      <div class="nav-sheet-handle"></div>
      <div class="nav-sheet-list" id="nav-sheet-list"></div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Scripts dans l'ordre de dépendance -->
  <script src="js/config.js?v=23"></script>
  <script src="js/supabaseClient.js?v=23"></script>
  <script src="js/data.js?v=23"></script>
  <script src="js/app.js?v=23"></script>
  <script src="js/dashboard.js?v=23"></script>
  <script src="js/scorecard.js?v=23"></script>
  <script src="js/radar.js?v=23"></script>
  <script src="js/analyse.js?v=23"></script>
  <script src="js/courses.js?v=23"></script>
  <script src="js/training.js?v=23"></script>
  <script src="js/coach.js?v=23"></script>
  <script src="js/groups.js?v=23"></script>
  <script src="js/calendar.js?v=23"></script>
  <script src="js/auth.js?v=23"></script>
  <script src="js/boot.js?v=23"></script>

  <!-- Enregistrement du Service Worker (PWA installable + hors-ligne) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js?v=23').catch(function (e) {
          console.warn('[TSG] SW non enregistré:', e && e.message);
        });
      });
    }
  </script>
</body>
</html>
